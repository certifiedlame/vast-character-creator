<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karakter maken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --z:1; --gridMax:420px;
    --ink:#1f2636; --ink-2:#3b4458; --muted:#8a93a6; --line:#d5dae4; --soft:#f2f4f8;
    --card:#ffffff; --blue:#2f7cf6; --blue-d:#1d5ccc; --green:#3f9b3a; --green-d:#2c7428; --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#c9d4e3;color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;z-index:1;display:block;cursor:default;touch-action:none}
  #stage.can-grab{cursor:grab} #stage.grabbing{cursor:grabbing} #stage.spin{cursor:ew-resize}
  #shade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 85% 95% at 50% 50%,transparent 60%,rgba(20,28,48,.18) 100%)}

  /* shared chunky card look */
  .ui{position:fixed;z-index:5;zoom:var(--z)}
  .box{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink)}
  .px{font-family:"Pixelify Sans",monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  button{font:inherit;color:inherit}
  button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  /* name */
  #nameCard{left:26px;top:22px;width:318px;display:flex;align-items:center;gap:16px;padding:12px 18px 12px 14px}
  #nameCard svg{width:50px;height:50px;flex:none;border-radius:4px;image-rendering:pixelated}
  #nameCard .lab{font-size:11px;color:var(--ink-2);margin-bottom:2px}
  #nameCard input{width:100%;border:0;border-bottom:2px dashed #9aa3b5;background:transparent;font:800 21px Nunito;color:var(--ink);padding:0 0 4px;outline:none}
  #nameCard input::placeholder{color:#59627a}
  #nameCard input:focus{border-bottom-color:var(--blue)}

  /* add / remove characters */
  #addChar{left:358px;top:34px} #delChar{left:426px;top:34px}
  #addChar b{position:absolute;right:-12px;bottom:-11px;background:var(--blue);color:#fff;border:2.5px solid var(--ink);border-radius:9px;font:800 11.5px Nunito;padding:1px 6px;line-height:1.3}
  #addChar:disabled{opacity:.5;cursor:default} #addChar:disabled:active{transform:none;box-shadow:0 5px 0 var(--ink)}
  #delChar.hide{display:none}

  /* body panel */
  #bodyCard{left:26px;top:144px;width:282px;padding:16px 18px 18px}
  #bodyCard .hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:left}
  #bodyCard h2,.ph h2{margin:0;font-size:21px;color:var(--ink)}
  #bodyCard .chev{font:900 14px Nunito;color:var(--muted);transition:transform .2s}
  #bodyCard.closed .chev{transform:rotate(-90deg)} #bodyCard.closed .bd{display:none}
  .fl{font:800 14px Nunito;color:var(--ink-2);display:flex;justify-content:space-between;margin:16px 0 8px}
  .fl b{font-weight:800;color:var(--ink)}
  #tones{display:flex;gap:8px}
  .tone{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);cursor:pointer;padding:0;transition:transform .1s}
  .tone:hover{transform:translateY(-2px)}
  .tone.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),#e1e5ee var(--p,50%))}
  input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),#e1e5ee var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d);margin-top:-6px}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d)}

  /* top-right tools */
  #tools{right:26px;top:22px;display:flex;gap:14px}
  .tbtn{width:56px;height:56px;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s}
  .tbtn.on{background:#e8f0ff;border-color:var(--blue);box-shadow:0 5px 0 var(--blue-d)} .tbtn.on svg{stroke:var(--blue-d)}
  .tbtn:hover{background:var(--soft)} .tbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .tbtn svg{width:26px;height:26px}
  #settings{right:26px;top:96px;width:260px;padding:14px 16px;display:none;z-index:8}
  #settings.open{display:block}
  #settings label{display:flex;justify-content:space-between;align-items:center;font:800 14px Nunito;padding:8px 0;cursor:pointer}
  #settings input{width:18px;height:18px;accent-color:var(--blue)}

  /* wardrobe */
  #panel{right:26px;top:104px;width:512px;display:flex;gap:14px;padding:16px 16px 18px 14px}
  #tabs{display:flex;flex-direction:column;gap:10px}
  .tab{width:56px;height:56px;border-radius:12px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s,transform .08s}
  .tab svg{width:28px;height:28px}
  .tab:hover{background:var(--soft)}
  .tab.on{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)} .tab.on svg rect{fill:#fff}
  .pc{flex:1;min-width:0;display:flex;flex-direction:column}
  .ph{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px}
  .ph h2{font-size:23px}
  .ph span{font:700 14px Nunito;color:var(--ink-2)}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:var(--gridMax);overflow-y:auto;padding:12px 6px 10px 4px;margin:-12px -6px 0 -4px;align-content:start;scrollbar-width:thin;scrollbar-color:#c3c9d6 transparent}
  .card{position:relative;background:#fff;border:2.5px solid #2a3242;border-radius:12px;box-shadow:0 4px 0 #2a3242;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:stretch;transition:transform .1s;text-align:center}
  .card:hover{transform:translateY(-2px)}
  .card .th{aspect-ratio:1/.8;display:grid;place-items:center;overflow:hidden;border-radius:10px 10px 0 0;background:radial-gradient(circle at 50% 45%,#fbfcfe,#eef1f6 80%)}
  .card .th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .card .th img.ok{opacity:1}
  .card .lbl{font:800 13.5px Nunito;padding:4px 6px 9px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .no{position:absolute;inset:0 0 28px;display:grid;place-items:center;font:900 40px Nunito;color:#c7ccd8;pointer-events:none}
  .card.on{border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
  .card .chk{position:absolute;top:-11px;right:-11px;width:30px;height:30px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d);display:none;place-items:center}
  .card .chk svg{width:14px;height:14px}
  .card.on .chk{display:grid}
  .sep{border-top:2px dashed var(--line);margin:14px 0 10px}
  .kl{font:800 15px Nunito;color:var(--ink-2);margin:0 0 9px;display:flex;justify-content:space-between}
  .kl span{font-weight:700;color:var(--muted);font-size:13px}
  #colors{display:flex;flex-wrap:wrap;gap:9px;min-height:36px}
  .sw{width:36px;height:36px;border-radius:7px;border:2px solid var(--ink);cursor:pointer;padding:0;transition:transform .1s}
  .sw:hover{transform:translateY(-2px)}
  .sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--blue)}
  #colors .none{font:700 13px Nunito;color:var(--muted);align-self:center}

  /* rotate arrows (positioned next to the character by JS) */
  .rot{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s}
  .rot:hover{background:var(--soft)} .rot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .rot svg{width:28px;height:28px}

  /* camera shots */
  #shots{left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px}
  #shots button{border:0;background:none;height:40px;padding:0 13px;border-radius:9px;font:800 13.5px Nunito;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  #shots button:hover{background:var(--soft)}
  #shots button.on{background:var(--blue);color:#fff}
  #shots .auto{border:2px solid var(--line);height:36px}
  #shots .auto i{width:9px;height:9px;border-radius:50%;background:#c3c9d6;display:block}
  #shots .auto.on{border-color:var(--blue);background:#e8f0ff;color:var(--blue-d)} #shots .auto.on i{background:var(--green)}
  #shots .div{width:2px;height:26px;background:var(--line);margin:0 4px}
  #shots svg{width:16px;height:16px}
  .rot{transition:transform .08s,opacity .3s}

  /* bottom toolbar */
  #toolbar{left:50%;bottom:20px;transform:translateX(-50%);display:flex;padding:6px 10px}
  #toolbar button{width:100px;height:66px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;border-radius:10px;font:800 13px Nunito;color:var(--ink)}
  #toolbar button:hover:not(:disabled){background:var(--soft)}
  #toolbar button:disabled{color:#b3bac8;cursor:default}
  #toolbar svg{width:26px;height:26px}
  #cancel{right:226px;bottom:22px;width:62px;height:62px;display:grid;place-items:center;cursor:pointer;padding:0}
  #cancel svg{width:24px;height:24px}
  #done{right:26px;bottom:22px;width:184px;height:62px;border-radius:12px;border:3px solid var(--ink);background:var(--green);box-shadow:inset 0 -5px 0 var(--green-d),0 5px 0 var(--ink);color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .08s}
  #done:hover{filter:brightness(1.06)} #done:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 var(--green-d),0 1px 0 var(--ink)}
  #done svg{width:26px;height:26px}
  #cancel:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

  #toast{position:fixed;z-index:9;left:50%;top:24px;transform:translate(-50%,-160%);background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 20px;font-size:21px;box-shadow:0 5px 0 var(--ink);transition:transform .35s cubic-bezier(.2,1.4,.4,1);zoom:var(--z)}
  #toast.show{transform:translate(-50%,0)}

  /* speech bubbles above the characters */
  #bubbles{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .bub{position:absolute;left:0;top:0;transform-origin:50% 100%;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:6px 13px 7px;font:800 calc(17px*var(--z,1)) Nunito;color:var(--ink);white-space:nowrap;will-change:transform,opacity}
  .bub::before{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .bub::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
  .bub.loud{background:#fff3c4} .bub.loud::after{border-top-color:#fff3c4}
  /* 3D hand cursor (mouse only; the native cursor comes back if WebGL for it fails) */
  #hand3d{position:fixed;inset:0;z-index:40;pointer-events:none;width:100vw;height:100vh}
  @media (pointer:fine){ html.hand3d, html.hand3d *{cursor:none !important} }
  #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#e9eef5;transition:opacity .5s}
  #loading.gone{opacity:0;pointer-events:none}
  #loading .t{font-size:30px;text-align:center}
  #loading .bar{width:260px;height:20px;border:3px solid var(--ink);border-radius:8px;background:#fff;margin:14px auto 0;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--blue) 0 14px,#5b9bff 14px 28px);transition:width .2s}
  #loading .err{color:var(--red);font:800 14px Nunito;margin-top:12px;max-width:420px;text-align:center}

  /* phones: wardrobe becomes a bottom sheet with tabs in a row */
  @media (max-width:819px){
    #nameCard{left:10px;top:10px;width:230px;padding:8px 12px 8px 10px;gap:10px} #nameCard svg{width:36px;height:36px} #nameCard input{font-size:17px}
    #bodyCard{left:10px;top:88px;width:230px;padding:10px 14px}
    #tools{right:10px;top:10px;gap:8px} .tbtn{width:46px;height:46px}
    #addChar{left:250px;top:14px} #delChar{left:304px;top:14px}
    #settings{right:10px;top:70px}
    #panel{left:8px;right:8px;top:auto;bottom:88px;width:auto;flex-direction:column;gap:10px;padding:10px 10px 12px}
    #tabs{flex-direction:row;justify-content:space-between}
    .tab{width:46px;height:46px}
    #grid{grid-template-columns:repeat(4,1fr);gap:8px}
    .card .lbl{font-size:11px}
    #toolbar{left:8px;bottom:10px;transform:none;padding:4px}
    #shots{top:66px;left:8px;right:8px;transform:none;overflow-x:auto;scrollbar-width:none} #shots button{height:34px;padding:0 9px;font-size:12px}
    #toolbar button{width:54px;height:56px;font-size:0;gap:0}
    #cancel{right:150px;bottom:12px;width:54px;height:54px}
    #done{right:8px;bottom:12px;width:132px;height:54px;font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="Karakter. Sleep om te draaien, pak een lichaamsdeel om op te tillen."></canvas>
<div id="shade"></div>

<div id="nameCard" class="ui box">
  <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
    <rect width="8" height="8" fill="#8a5a2e"/><rect width="8" height="2" fill="#5cb846"/><rect y="2" width="8" height="1" fill="#4a9a39"/>
    <rect x="1" y="3" width="1" height="1" fill="#4a9a39"/><rect x="4" y="3" width="1" height="2" fill="#4a9a39"/><rect x="6" y="3" width="1" height="1" fill="#4a9a39"/>
    <rect x="2" y="5" width="1" height="1" fill="#6f4622"/><rect x="5" y="6" width="1" height="1" fill="#6f4622"/><rect x="1" y="7" width="1" height="1" fill="#a06a37"/><rect x="3" y="1" width="1" height="1" fill="#79cf5c"/><rect x="6" y="0" width="1" height="1" fill="#79cf5c"/>
  </svg>
  <div style="flex:1;min-width:0"><div class="lab px">Naam</div><input id="name" placeholder="Typ je naam..." maxlength="16" spellcheck="false" aria-label="Naam"></div>
</div>

<button id="addChar" class="ui box tbtn" title="Karakter toevoegen" aria-label="Karakter toevoegen"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><b id="charCount">1/5</b></button>
<button id="delChar" class="ui box tbtn hide" title="Dit karakter verwijderen" aria-label="Karakter verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="#e23b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg></button>

<section id="bodyCard" class="ui box">
  <button class="hd" id="bodyToggle" aria-expanded="true"><h2 class="px">Lichaam</h2><span class="chev">▾</span></button>
  <div class="bd">
    <div class="fl">Huidskleur</div>
    <div id="tones" role="radiogroup" aria-label="Huidskleur"></div>
    <div class="fl"><span>Lengte</span><b id="hV">50</b></div>
    <input type="range" id="height" min="0" max="100" value="50" aria-label="Lengte">
    <div class="fl"><span>Bouw</span><b id="bV">50</b></div>
    <input type="range" id="build" min="0" max="100" value="50" aria-label="Bouw">
    <div class="fl"><span>Grootte</span><b id="sV">50</b></div>
    <input type="range" id="size" min="0" max="100" value="50" aria-label="Grootte">
  </div>
</section>

<div id="tools" class="ui">
  <button class="tbtn box" id="gravBtn" title="Zwaartekracht uit/aan (G)" aria-label="Gewichtloos" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.6"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-22 12 12)"/><path d="M19 4.5l.01 0M5 19.5l.01 0" stroke-width="3"/></svg></button>
  <button class="tbtn box" id="envBtn" title="Omgeving wisselen (E)" aria-label="Omgeving wisselen"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg></button>
  <button class="tbtn box" id="shot" title="Screenshot opslaan" aria-label="Screenshot opslaan"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></button>
  <button class="tbtn box" id="export" title="Loadout exporteren (JSON)" aria-label="Loadout exporteren"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.4" stroke-linejoin="round"><path d="M3 6.5h6.5l2 2H21V19H3z"/></svg></button>
  <button class="tbtn box" id="setBtn" title="Instellingen" aria-label="Instellingen" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
</div>
<div id="settings" class="ui box" role="dialog" aria-label="Instellingen">
  <label>Kijkt naar de muis <input type="checkbox" id="optLook" checked></label>
  <label>Reacties op kleding <input type="checkbox" id="optReact" checked></label>
  <label>Diepte-effect camera <input type="checkbox" id="optPar" checked></label>
  <label>Spraakwolkjes <input type="checkbox" id="optBub" checked></label>
</div>

<nav id="shots" class="ui box" aria-label="Camerahoeken">
  <button class="auto on" id="camAuto" title="Camera volgt het gekozen kledingtype (C wisselt hoek)"><i></i>Auto</button>
  <span class="div"></span>
</nav>

<aside id="panel" class="ui box" aria-label="Kleding">
  <div id="tabs" role="tablist"></div>
  <div class="pc">
    <div class="ph"><h2 class="px" id="catTitle">Haar</h2><span id="catCount"></span></div>
    <div id="grid" role="listbox"></div>
    <div class="sep"></div>
    <div class="kl">Kleur <span id="colName"></span></div>
    <div id="colors"></div>
  </div>
</aside>

<button id="rotL" class="ui rot" aria-label="Draai naar links"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-5-5 5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-2"/></svg></button>
<button id="rotR" class="ui rot" aria-label="Draai naar rechts"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h2"/></svg></button>

<nav id="toolbar" class="ui box" aria-label="Acties">
  <button id="dice"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2636" stroke-width="2.4"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><g fill="#1f2636" stroke="none"><circle cx="8.5" cy="8.5" r="1.6"/><circle cx="15.5" cy="8.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8.5" cy="15.5" r="1.6"/><circle cx="15.5" cy="15.5" r="1.6"/></g></svg>Willekeurig</button>
  <button id="undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Ongedaan</button>

/* ---- Rooms: each background is projection-mapped onto a crude box room (+ desk blocks) ----

   unmoved view reproduces the picture exactly. Units: Steve = 2 tall. */
const ROOM = { W:5.2, H:3.6, D:7.2, camH:1.28, VTAN:722/1679, ASPECT:2912/1632 };
const projCam = new THREE.PerspectiveCamera(THREE.MathUtils.radToDeg(2*Math.atan(ROOM.VTAN)), ROOM.ASPECT, 0.1, 50);
projCam.position.set(0, ROOM.camH, 0); projCam.lookAt(0, ROOM.camH, -1); projCam.updateMatrixWorld(true);
const projVP = new THREE.Matrix4().multiplyMatrices(projCam.projectionMatrix, projCam.matrixWorldInverse);
const wipeRes = new THREE.Vector2(1,1);
// mode 0: plain · 1: incoming room, left of the wipe edge · 2: outgoing room, right of it
function makeRoomMat(tex){

    uniforms:{ map:{value:tex}, shift:{value:new THREE.Vector3()}, projVP:{value:projVP}, mode:{value:0}, edge:{value:0}, res:{value:wipeRes} },
    vertexShader:`varying vec3 vW;
      void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`uniform sampler2D map; uniform mat4 projVP; uniform vec3 shift; uniform int mode; uniform float edge; uniform vec2 res; varying vec3 vW;
      void main(){
        float s = gl_FragCoord.x/res.x + (gl_FragCoord.y/res.y - 0.5)*0.16;
        if (mode==1 && s > edge) discard;
        if (mode==2 && s <= edge) discard;
        vec4 p = projVP*vec4(vW+shift,1.0);
        vec2 uv = clamp(p.xy/p.w*0.5+0.5, vec2(0.0005), vec2(0.9995));
        vec3 col = texture2D(map, uv).rgb;
        if (mode==1) col = mix(col, vec3(1.0), smoothstep(edge-0.01, edge, s)*0.85);
        gl_FragColor = vec4(col, 1.0);

}

  for (const [x0,x1,z0,z1,h] of env.blocks){ const a=Math.max(z0,-D+0.05); const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,h,z1-a), mat); m.position.set((x0+x1)/2,h/2,(a+z1)/2); g.add(m); }

}
/* backgrounds share the camera; room depth D comes from where the floor meets the back wall

const ENVS = [
  { id:'klas', name:'Klaslokaal', file:'background game.png', D:7.2,

    dust:[0xe2bf93,0xd2aa7c,0xf0dcbd],

}
const _c1 = new THREE.Color(), _c2 = new THREE.Color();

  C(rimR.color, A.rimR[0], B.rimR[0]); rimR.intensity = L(A.rimR[1], B.rimR[1]);
  C(hemi.color, A.sky, B.sky); C(hemi.groundColor, A.ground, B.ground); hemi.intensity = L(A.hemi, B.hemi);

}

}
function finishWipe(){

  from.group.visible = false; from.mat.uniforms.mode.value = 0; to.mat.uniforms.mode.value = 0;

async function switchEnv(dir=1){

  if (!to.group){ envBusy = true; toast('Laden…'); try{ await loadEnv(to); } catch(err){ toast('Omgeving niet geladen'); return; } finally{ envBusy = false; } }

  from.mat.uniforms.edge.value = to.mat.uniforms.edge.value = -0.1;
  from.group.visible = to.group.visible = true;
  wipe = { from, to, t:0, dur:0.95, swapped:false };

}
function updateWipe(dt){
  if (!wipe) return;
  wipe.t = Math.min(1, wipe.t + dt/wipe.dur);
  const edge = -0.1 + easeIO(wipe.t)*1.3;
  wipe.from.mat.uniforms.edge.value = wipe.to.mat.uniforms.edge.value = edge;
  mixLight(wipe.from, wipe.to, smooth(0.1, 0.9, wipe.t));
  if (!wipe.swapped){   // reflections switch the moment the edge passes the character

function faceRects(p){ const {u,v,w,h,d}=p; return {
  top:[u+d,v,w,d], bottom:[u+d+w,v,w,d],
  right:[u,v+d,d,h], front:[u+d,v+d,w,h], left:[u+d+w,v+d,d,h], back:[u+2*d+w,v+d,w,h] }; }

}

/* ============================================================

function vox(boxes, mat){
  const geos=[]; const col=new THREE.Color();
  boxes.forEach((b,bi)=>{
    const [x0,y0,z0,x1,y1,z1,hex,amt=0.05]=b;
    const g=new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0));
    g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    const n=g.attributes.normal, cols=new Float32Array(n.count*3);
    const k0 = 1+(hash(bi,7,3)-0.5)*2*amt;
    col.setHex(hex);
    for(let i=0;i<n.count;i++){ const ny=n.getY(i); const k=k0*(ny>0.5?1.07:ny<-0.5?0.82:1); cols[i*3]=col.r*k; cols[i*3+1]=col.g*k; cols[i*3+2]=col.b*k; }
    g.setAttribute('color', new THREE.BufferAttribute(cols,3));
    geos.push(g);
  });

  m.castShadow=true; m.receiveShadow=true;
  return m;
}

  };

}

/* ---- Reaction clips: one per body part / item ----
   Channels (radians, char space): head:[pitchUp, yaw(+ = his left), roll]  chest:[leanFwd, yaw, roll]
   lArm/rArm:[raiseFwd, out]  lLeg/rLeg:[kickFwd, out]  hop (units)  sq (squash)  item:[x,y,z] lift of held item */
const bump = (t,a,b,c,d) => smooth(a,b,t)*(1-smooth(c,d,t));
const REACT = {
  // run fingers through the new hair, then a little head toss
  hair:{T:1.6, f:t=>{ const brush=bump(t,.02,.3,.6,.95);
    return { rArm:[2.5*brush, -0.35*brush], head:[0.12*brush + 0.18*bump(t,.7,.85,1,1.35), 0, 0.32*Math.sin((t-.65)*9)*bump(t,.65,.75,1.05,1.4)], chest:[-0.05*brush,0,0] }; }},
  // reach up and set the hat, then a little nod
  hat:{T:1.5, f:t=>{ const r=bump(t,.0,.3,.55,.85), nod=bump(t,.6,.75,.85,1.1);
    return { rArm:[2.75*r, -0.5*r], lArm:[2.6*r, -0.5*r], head:[-0.12*r - 0.25*nod, 0, 0], hop:0.035*bump(t,1.05,1.15,1.15,1.3) }; }},
  // look down at the new top, arms out, twist side-to-side to check the fit
  top:{T:1.7, f:t=>{ const o=bump(t,.0,.25,1.2,1.6), tw=bump(t,.25,.4,1.0,1.3);
    return { head:[-0.5*o,0,0], lArm:[0.15*o, 0.55*o], rArm:[0.15*o, 0.55*o], chest:[0.05*o, 0.3*Math.sin((t-.25)*7.5)*tw, 0] }; }},
  // small squat, look down, alternate kicks
  bottom:{T:1.6, f:t=>{ const o=bump(t,0,.2,1.15,1.55);
    return { head:[-0.6*o,0,0], sq:0.06*bump(t,0,.12,.25,.45), lLeg:[0.45*bump(t,.3,.42,.48,.62),0], rLeg:[0.45*bump(t,.62,.74,.8,.95),0], lArm:[0,0.25*o], rArm:[0,0.25*o], chest:[0.08*o,0,0] }; }},
  // lift a foot, tap the toe, admire
  shoes:{T:1.7, f:t=>{ const o=bump(t,0,.25,1.2,1.6), lift=bump(t,.1,.3,1.05,1.3);
    return { head:[-0.72*o,-0.15*o,0], chest:[0.1*o,-0.12*o,0], rLeg:[0.35*lift + 0.16*Math.abs(Math.sin((t-.3)*13))*bump(t,.3,.4,.95,1.05), 0.08*lift], lArm:[0,0.3*o], rArm:[0,0.22*o] }; }},
  // push the shades up the nose, cool double nod
  shades:{T:1.7, f:t=>{ const p=bump(t,0,.22,.42,.62), n=bump(t,.6,.7,1.25,1.5);
    return { rArm:[2.3*p,-0.6*p], head:[0.12*p - 0.16*Math.abs(Math.sin((t-.6)*7))*n, 0.15*n, 0.16*n], chest:[-0.06*n,0,0] }; }},
  // pat the chain on the chest
  chain:{T:1.5, f:t=>{ const o=bump(t,0,.25,1,1.35);
    return { rArm:[1.25*o + 0.18*Math.sin(t*20)*bump(t,.3,.4,.9,1), -0.55*o], head:[-0.45*o,0,0], chest:[-0.05*o,0,0] }; }},
  // glance over the shoulder at the backpack, hop to settle it
  backpack:{T:1.8, f:t=>{ const o=bump(t,.05,.35,1.1,1.5);
    return { head:[0.05*o, 1.0*o, 0], chest:[0, 0.35*o, 0], lArm:[0,0.18*o], rArm:[0,0.12*o], hop:0.05*bump(t,1.2,1.3,1.3,1.45) }; }},
  // hug yourself, cosy shiver
  scarf:{T:1.6, f:t=>{ const o=bump(t,0,.25,1.1,1.5);
    return { lArm:[0.8*o,-0.4*o], rArm:[0.8*o,-0.4*o], head:[-0.3*o,0,0], chest:[0.06*o, 0.06*Math.sin(t*38)*o, 0], sq:0.02*o }; }},
  // keepy-uppy with the ball
  football:{T:1.9, f:t=>{ const o=bump(t,0,.2,1.5,1.85), b=Math.abs(Math.sin((t-.15)*6.3))*bump(t,.15,.25,1.45,1.6);
    return { rArm:[0.9*o + 0.12*b, 0], item:[0, 0.55*b, 0], head:[-0.25*o + 0.35*b, -0.3*o, 0] }; }},
  // weigh the brick in your hand
  brick:{T:1.5, f:t=>{ const o=bump(t,0,.2,1.05,1.4);
    return { rArm:[1.0*o + 0.22*Math.sin(t*11)*Math.exp(-t*1.5)*o, 0], head:[-0.35*o, -0.4*o, 0.1*o], chest:[0.04*o,-0.1*o,0] }; }},
  // practice swing
  bat:{T:1.8, f:t=>{ const ready=bump(t,0,.25,1.3,1.7), wind=bump(t,.15,.4,.48,.58), swing=bump(t,.5,.62,.8,1.15);
    return { rArm:[1.3*ready + 0.5*swing, 0.5*wind - 0.5*swing], lArm:[0.9*ready, -0.3*ready], chest:[0.05*ready, 0.55*wind - 0.75*swing, 0], head:[-0.05*ready, -0.25*wind + 0.35*swing, 0], lLeg:[0.18*wind,0] }; }},
  cheer:{T:1.7, f:t=>{ const o=bump(t,0,.2,1.1,1.6);
    return { lArm:[2.9*o,0.45*o], rArm:[2.9*o,0.45*o], head:[0.3*o,0,0], hop:0.16*bump(t,.15,.3,.3,.5) + 0.08*bump(t,.6,.72,.72,.88) }; }},
  wave:{T:1.8, f:t=>{ const o=bump(t,0,.25,1.3,1.75);
    return { rArm:[0.2*o, (2.5 + 0.35*Math.sin(t*15))*o], head:[0.05*o,0,0.14*o] }; }},
  // ---- celebrations for "Willekeurig" (one is picked at random, never twice in a row) ----
  // full twirl with arms out
  twirl:{T:1.6, f:t=>{ const o=bump(t,0,.15,1.2,1.55);
    return { yaw:Math.PI*2*smooth(.1,.95,t), lArm:[0.3*o,1.35*o], rArm:[0.3*o,1.35*o], head:[0.15*o,0,0], hop:0.12*bump(t,.3,.5,.55,.85), sq:0.05*bump(t,.95,1.05,1.1,1.3) }; }},
  // strongman: wide stance, arms out, two pumps
  flex:{T:1.8, f:t=>{ const o=bump(t,0,.2,1.3,1.7), pump=bump(t,.35,.5,.55,.7)+bump(t,.8,.95,1,1.15);
    return { lArm:[0.35*o,(1.55+0.3*pump)*o], rArm:[0.35*o,(1.55+0.3*pump)*o], chest:[-0.12*o,0,0], head:[0.22*o,0,0], sq:0.05*pump, lLeg:[0,0.2*o], rLeg:[0,0.2*o] }; }},
  // dab
  dab:{T:1.7, f:t=>{ const o=bump(t,.08,.22,1.15,1.6);
    return { rArm:[2.2*o,1.0*o], lArm:[1.6*o,-0.7*o], head:[-0.45*o,0.55*o,0.2*o], chest:[0.12*o,0.25*o,0], sq:0.06*bump(t,0,.08,.1,.25) }; }},
  // deep bow, then a fist in the air
  bow:{T:1.9, f:t=>{ const o=bump(t,0,.35,.8,1.15), up=bump(t,1.0,1.2,1.5,1.85);
    return { chest:[0.55*o,0,0], head:[-0.3*o+0.25*up,0,0], rArm:[0.5*o+2.6*up,0.3*up], lArm:[0.2*o,0], hop:0.08*bump(t,1.15,1.28,1.3,1.5) }; }},
  // shoulder shimmy
  shimmy:{T:1.8, f:t=>{ const o=bump(t,0,.2,1.3,1.75), w=Math.sin(t*22);
    return { chest:[0,0.22*w*o,0.05*w*o], head:[0.1*o,-0.15*w*o,0], lArm:[0.6*o,0.7*o], rArm:[0.6*o,0.7*o], sq:0.025*Math.abs(w)*o }; }},
  // two jumping jacks
  jacks:{T:1.9, f:t=>{ const x=clamp((t-.1)/1.5,0,1), j=Math.abs(Math.sin(x*Math.PI*2)), o=bump(t,0,.1,1.6,1.85);
    return { lArm:[0.1*j*o,2.7*j*o], rArm:[0.1*j*o,2.7*j*o], lLeg:[0,0.32*j*o], rLeg:[0,0.32*j*o], hop:0.08*Math.abs(Math.sin(x*Math.PI*4))*o }; }},
  // catwalk: hands on hips, three-quarter turn and a look back
  model:{T:2.0, f:t=>{ const o=bump(t,0,.25,1.5,1.95), turn=bump(t,.2,.5,1.15,1.55);
    return { yaw:0.75*turn, lArm:[-0.35*o,0.75*o], rArm:[-0.35*o,0.75*o], head:[0.15*o,-0.55*turn,0.15*o], chest:[-0.06*o,0,0.06*o], lLeg:[0.25*o,0] }; }},
  // ---- idle fidgets (when nobody has touched anything for a while) ----
  stretch:{T:2.6, f:t=>{ const o=bump(t,0,.6,1.7,2.4);
    return { lArm:[2.9*o,0.25*o], rArm:[2.9*o,0.25*o], chest:[-0.18*o,0,0], head:[0.35*o,0,0], sq:-0.03*o }; }},
  lookaround:{T:2.6, f:t=>{ const a=bump(t,.1,.45,.9,1.15), b=bump(t,1.1,1.45,1.9,2.3);
    return { head:[0.05*(a+b), 0.75*a-0.75*b, 0], chest:[0, 0.15*a-0.15*b, 0] }; }},
  scratch:{T:2.0, f:t=>{ const o=bump(t,0,.35,1.4,1.9), sc=Math.sin(t*26)*bump(t,.35,.45,1.3,1.4);
    return { rArm:[2.55*o+0.12*sc, -0.45*o], head:[-0.1*o,0,-0.22*o], chest:[0,0,-0.05*o] }; }},
  shift:{T:2.0, f:t=>{ const o=bump(t,0,.4,1.3,1.9);
    return { chest:[0,0.08*o,0.1*o], head:[0,0,-0.12*o], lLeg:[0,0.12*o], rLeg:[0.1*o,0], lArm:[0,0.12*o], sq:0.015*o }; }},
  tap:{T:2.2, f:t=>{ const o=bump(t,0,.2,1.8,2.15), tp=Math.max(0,Math.sin(t*14))*bump(t,.2,.3,1.7,1.85);
    return { rLeg:[0.18*o+0.22*tp,0.05*o], lArm:[-0.25*o,0.55*o], rArm:[-0.25*o,0.55*o], head:[-0.08*o,0.2*o,0] }; }},
  yawn:{T:2.4, f:t=>{ const o=bump(t,.1,.6,1.6,2.2);
    return { head:[0.45*o,0,0], rArm:[2.2*o,0.2*o], chest:[-0.08*o,0,0], lArm:[0,0.1*o] }; }},
  // ---- reacting to the others ----
  laugh:{T:1.9, f:t=>{ const o=bump(t,0,.15,1.4,1.85), sh=Math.abs(Math.sin(t*18));
    return { chest:[(0.18+0.08*sh)*o,0,0], head:[(0.25-0.1*sh)*o,0,0], lArm:[0.6*o,-0.2*o], rArm:[0.6*o,-0.2*o], sq:0.03*sh*o }; }},
  clap:{T:1.5, f:t=>{ const o=bump(t,0,.15,1.05,1.45), c=Math.sin(t*24);
    return { lArm:[1.35*o,(0.1+0.25*c)*o], rArm:[1.35*o,(0.1+0.25*c)*o], head:[0.12*o,0,0], hop:0.03*bump(t,.2,.3,.35,.5) }; }},
  // back on his feet after being dangled: woozy head circles
  dizzy:{T:2.0, f:t=>{ const o=bump(t,0,.15,1.4,1.95);
    return { head:[0.14*Math.sin(t*8)*o, 0.28*Math.cos(t*8)*o, 0.22*Math.sin(t*8)*o], chest:[0.05*Math.sin(t*5)*o, 0, 0.08*Math.cos(t*5)*o], lArm:[0,0.28*o], rArm:[0,0.28*o] }; }},

/* ============================================================
   RIG  (wraps a loaded / cloned Steve)
   ============================================================ */
const BONES = ['World_Bone','Chest','Head','Left_Arm','Right_Arm','Left_Leg','Right_Leg'];
function makeRig(modelRoot, holder, castShadow){
  const rig = { root:modelRoot, bones:{}, restChar:{}, restCharQ:{}, attached:{} };
  const cvs = document.createElement('canvas'); cvs.width=cvs.height=64;
  rig.ctx = cvs.getContext('2d', {willReadFrequently:true});
  rig.tex = new THREE.CanvasTexture(cvs);
  Object.assign(rig.tex, {flipY:false, magFilter:THREE.NearestFilter, minFilter:THREE.NearestFilter, generateMipmaps:false, colorSpace:THREE.SRGBColorSpace});
  // glow mask: white where the last texture change touched pixels, so only the changed garment flashes
  const gc = document.createElement('canvas'); gc.width=gc.height=64;
  rig.glowCtx = gc.getContext('2d', {willReadFrequently:true}); rig.glowCtx.fillStyle='#000'; rig.glowCtx.fillRect(0,0,64,64);
  rig.glowTex = new THREE.CanvasTexture(gc);
  Object.assign(rig.glowTex, {flipY:false, magFilter:THREE.NearestFilter, minFilter:THREE.NearestFilter, generateMipmaps:false});
  rig.mat = new THREE.MeshStandardMaterial({map:rig.tex, emissiveMap:rig.glowTex, alphaTest:0.5, roughness:0.88, metalness:0, side:THREE.FrontSide});
  modelRoot.traverse(o=>{
    if (o.isBone && BONES.includes(o.name)) rig.bones[o.name]=o;
    if (o.isMesh){ o.material = rig.mat; o.castShadow = castShadow; o.receiveShadow = true; o.frustumCulled = false; }
  });
  holder.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(holder.matrixWorld).invert();
  for (const [n,b] of Object.entries(rig.bones)){
    rig.restChar[n] = inv.clone().multiply(b.matrixWorld);
    rig.restCharQ[n] = new THREE.Quaternion().setFromRotationMatrix(rig.restChar[n]);
  }
  const p = new THREE.Vector3().setFromMatrixPosition(rig.restChar.Right_Arm);
  rig.anchors = {
    head:  { bone:'Head',      pos:new THREE.Vector3(0,1.5,0) },
    chest: { bone:'Chest',     pos:new THREE.Vector3(0,0.75,0) },
    rhand: { bone:'Right_Arm', pos:new THREE.Vector3(p.x,0.75,0) },
  };
  return rig;
}
function attachItem(rig, key, item, v, mat){
  const spec = item.build(v);
  const mesh = vox(spec.boxes, mat);
  const inner = new THREE.Group(); inner.add(mesh);
  if (spec.offset) inner.position.set(...spec.offset);
  if (spec.rotX) inner.rotation.x = spec.rotX;
  const pxGroup = new THREE.Group(); pxGroup.scale.setScalar(PX); pxGroup.add(inner);
  const a = rig.anchors[spec.anchor];
  const charM = new THREE.Matrix4().makeTranslation(a.pos.x,a.pos.y,a.pos.z);
  const local = new THREE.Matrix4().copy(rig.restChar[a.bone]).invert().multiply(charM);
  const holder = new THREE.Group();
  local.decompose(holder.position, holder.quaternion, holder.scale);
  holder.add(pxGroup);
  rig.bones[a.bone].add(holder);
  holder.userData = { pop:0, removing:false, pxGroup, anchor:spec.anchor };
  rig.attached[key] = holder;
  return holder;
}
function detachItem(rig, key, instant){
  const h = rig.attached[key]; if (!h) return;
  delete rig.attached[key];
  if (instant){ h.parent?.remove(h); disposeTree(h); }
  else { h.userData.removing = true; h.userData.rt = 0; dying.push(h); }
}
function disposeTree(o){ o.traverse(m=>{ if(m.isMesh) m.geometry.dispose(); }); }
const dying = [];

/* ============================================================
   OUTFIT  → texture composition + voxel attachments
   ============================================================ */
let BASE = null;   // ImageData of the original skin
const DEFAULT_OUTFIT = () => ({ hair:'hair-none', hat:'hat-none', top:'top-steve', bottom:'bot-steve', shoes:'shoe-steve', held:'held-none', acc:{} , v:{} });
let outfit = DEFAULT_OUTFIT();
const variantOf = (o,id) => (o.v[id] ?? 0);

function composeInto(ctx, o, forBlink){
  const img = new ImageData(new Uint8ClampedArray(BASE.data), 64, 64);
  const d = img.data;
  for (const slot of ['bottom','top','shoes']){
    const it = ITEM[o[slot]];
    if (it && it.paint) it.paint(d, it.variants[variantOf(o,it.id)] || it.variants[0]);
  }
  ctx.putImageData(img,0,0);
  return img;
}
let mainRig, mannequin, curImage;
function refreshTexture(){
  const prev = curImage; curImage = composeInto(mainRig.ctx, outfit); mainRig.tex.needsUpdate = true;
  // mark exactly the pixels that changed (new garment, skin tone, …) in the glow mask
  const m = mainRig.glowCtx.createImageData(64,64), a = prev && prev.data, b = curImage.data, d = m.data;
  for (let i=0;i<b.length;i+=4){
    const ch = a && (Math.abs(a[i]-b[i]) + Math.abs(a[i+1]-b[i+1]) + Math.abs(a[i+2]-b[i+2]) > 18 || (a[i+3]>127) !== (b[i+3]>127));
    const v = ch ? 255 : 0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  mainRig.glowCtx.putImageData(m,0,0); mainRig.glowTex.needsUpdate = true;
}

function voxelKeys(o){
  const keys = {};
  for (const s of ['hair','hat','held']){ const it=ITEM[o[s]]; if (it && it.build) keys[s] = it.id+'#'+variantOf(o,it.id); }
  for (const id of Object.keys(o.acc)) keys['acc:'+id] = id+'#'+variantOf(o,id);
  return keys;
}
function syncVoxels(rig, o, mat, animate){
  const want = voxelKeys(o);
  for (const k of Object.keys(rig.attached)) if (rig.attached[k].userData.sig !== want[k]) detachItem(rig,k,!animate);

/* ============================================================
   IDLE RETARGET  (Mixamo FBX → Steve's 6-bone block rig)
   Works with deltas from the clip's average pose, so rest-pose
   differences (T-pose vs arms-down) don't matter.
   ============================================================ */
const nrm = n => n.toLowerCase().replace(/^mixamorig[:_]?/,'').replace(/[^a-z0-9]/g,'');

/* The block rig has no elbows/knees/spine, so each Steve bone takes the overall direction
   of the matching Mixamo limb (shoulder→hand, hip→foot) and the torso takes the hips→neck /
   shoulder-line frame. That reproduces the idle's actual stance, not just its wobble. */
function setupRetarget(fbx){
  // FBX files from Mixamo often hold an empty 'Take 001' next to the real 'mixamo.com' take
  const clip = [...(fbx.animations||[])].sort((x,y)=>y.tracks.length-x.tracks.length)[0];
  if (!clip || !clip.tracks.length) throw new Error('No animation tracks in FBX');
  // duplicate bone names exist; the mixer binds the first one found, so do the same
  const src = {}; fbx.traverse(o=>{ if (o.isBone && !src[nrm(o.name)]) src[nrm(o.name)] = o; });
  const need = ['hips','neck','head','leftarm','rightarm','lefthand','righthand','leftupleg','rightupleg','leftfoot','rightfoot'];
  for (const n of need) if (!src[n]) throw new Error('FBX missing bone '+n);

  mixer.setTime(0); fbx.updateMatrixWorld(true);
  const L = src.leftarm.getWorldPosition(new THREE.Vector3()).sub(src.rightarm.getWorldPosition(new THREE.Vector3())); L.y=0; L.normalize();
  const F = new THREE.Quaternion().setFromUnitVectors(L, new THREE.Vector3(1,0,0));

  const foot = Math.min(...['lefttoebase','righttoebase','leftfoot','rightfoot'].filter(n=>src[n]).map(n=>src[n].getWorldPosition(new THREE.Vector3()).y));
  const scale = 2.0 / Math.max(1e-6, top - foot);

  const head = { sum:new THREE.Vector4(), first:null };

    src.head.getWorldQuaternion(_q); _q.premultiply(F);
    if (!head.first) head.first = _q.clone();

    head.sum.x += _q.x*sgn; head.sum.y += _q.y*sgn; head.sum.z += _q.z*sgn; head.sum.w += _q.w*sgn;
    hipsSum.add(src.hips.getWorldPosition(_v).applyQuaternion(F));

const DOWN = new THREE.Vector3(0,-1,0);
function srcP(R, n, out){ R.src[n].getWorldPosition(out).applyQuaternion(R.F); if (mirrored) out.x = -out.x; return out; }

  const sw = mirrored ? s=>s.replace(/^left/,'L#').replace(/^right/,'left').replace(/^L#/,'right') : s=>s;
  const P = n => srcP(R, sw(n), new THREE.Vector3());

  R.hips.getWorldPosition(_v).applyQuaternion(R.F).sub(R.hipsMean).multiplyScalar(R.scale*0.8);
  if (mirrored) _v.x = -_v.x;

let footPts = [];
function setupFeet(){

/* ---- body: skin tone, height, build ---- */
let BASE_ORIG = null, SKIN0 = null;
let body = { tone:3, height:50, build:50, size:50 };
const TONES = () => [0xf3d8c0, 0xe6b994, 0xcf9a6c, (SKIN0[0]<<16)|(SKIN0[1]<<8)|SKIN0[2], 0x8a5634, 0x58361f];
let appliedTone = -1;
function recolorSkin(toneHex){
  const d = new Uint8ClampedArray(BASE_ORIG.data); const t = rgb(toneHex);
  const lum = c => 0.299*c[0]+0.587*c[1]+0.114*c[2];
  const l0 = lum(SKIN0), s0 = SKIN0[0]+SKIN0[1]+SKIN0[2], n0 = SKIN0.map(v=>v/s0);
  const regions = [[0,0,32,16],[40,16,16,16],[32,48,16,16],[16,16,24,16]];
  for (const [rx,ry,rw,rh] of regions) for (let y=ry;y<ry+rh;y++) for (let x=rx;x<rx+rw;x++){
    const i=(y*64+x)*4; if (d[i+3]<128) continue; const c=[d[i],d[i+1],d[i+2]]; const l=lum(c); const s=c[0]+c[1]+c[2]||1;
    if (l < l0*0.42 || l > l0*1.75) continue;
    if (Math.hypot(c[0]/s-n0[0], c[1]/s-n0[1], c[2]/s-n0[2]) > 0.06) continue;
    const k = l/l0; d[i]=clamp(t[0]*k,0,255); d[i+1]=clamp(t[1]*k,0,255); d[i+2]=clamp(t[2]*k,0,255);
  }
  BASE = new ImageData(d,64,64); SKIN = t; SKIN_D = shadeRGB(t,0.85);
}
function applyBody(){
  if (appliedTone !== body.tone){ if (body.tone===3){ BASE = new ImageData(new Uint8ClampedArray(BASE_ORIG.data),64,64); SKIN = SKIN0.slice(); SKIN_D = shadeRGB(SKIN,0.85); } else recolorSkin(TONES()[body.tone]); appliedTone = body.tone; if (bound===active){ thumbCache.clear(); if (curCat) selectCat(curCat); } refreshTexture(); }
  const h = 0.9 + body.height/100*0.22, b = 0.86 + body.build/100*0.32;
  const z = body.size < 50 ? 0.75 + body.size/50*0.25 : 1 + (body.size-50)/50*0.4;   // 0.75x … 1.4x
  mainRig.root.scale.set(b*z, h*z, b*z);
}

  for (const [id,lab,key] of [['height','hV','height'],['build','bV','build'],['size','sV','size']]){ const el=$('#'+id); el.value=body[key]; el.style.setProperty('--p', body[key]+'%'); $('#'+lab).textContent=body[key]; }

    b.onclick=()=>{ body.tone=i; applyBody(); syncBodyUI(); glow=1; react('poke',0.6); commit(); }; wrap.appendChild(b); });

/* ============================================================
   INTERACTION: spin, zoom, grab-and-dangle, mouse tracking
   ============================================================ */
let spin = { angle:0, target:0, vel:0, drag:false, lastX:0, lastT:0 };
let zoom = 0, zoomT = 0; const par = {x:0,y:0};
const mouse = { x:0, y:0, ndc:new THREE.Vector2(), lastMove:0, speed:0, inside:false, overUI:false };
const press = { on:false, part:null, hit:null, x:0, y:0, t:0, id:0 };
const toNDC = (x,y) => new THREE.Vector2(x/innerWidth*2-1, -(y/innerHeight)*2+1);

// which body part is under the pointer?
const PART_OF = { head:'head', headwear:'head', body:'torso', jacket:'torso', left_arm:'lArm', left_sleve:'lArm', right_arm:'rArm', right_sleve:'rArm', left_leg:'lLeg', left_pants:'lLeg', right_leg:'rLeg', right_pants:'rLeg' };
const ANCHOR_PART = { head:'head', chest:'torso', rhand:'rArm' };
const pickRay = new THREE.Raycaster();
function pickPart(x,y){
  pickRay.setFromCamera(toNDC(x,y), camera);
  let best = null;
  for (const c of chars){
    if (!c.turntable.visible) continue;
    c.mainRig.root.traverse(o=>{ if (o.isSkinnedMesh) o.boundingSphere = null; });
    for (const h of pickRay.intersectObject(c.mainRig.root, true)){
      let o = h.object, part = PART_OF[o.name];
      while (!part && o){ if (o.userData && o.userData.anchor) part = ANCHOR_PART[o.userData.anchor]; o = o.parent; }
      if (part){ if (!best || h.distance < best.d) best = { part, point:h.point.clone(), c, d:h.distance }; break; }
    }
  }
  return best;
}
let grabC = null;   // the character currently dangling from the pointer
const canGrab = c => c.RAG.state==='off' || c.RAG.state==='recover' || c.RAG.state==='fall';
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  const hit = pickPart(e.clientX,e.clientY);
  if (hit && canGrab(hit.c)){ Object.assign(press, {on:true, part:hit.part, hit:hit.point, c:hit.c, x:e.clientX, y:e.clientY, t:performance.now()}); canvas.className='grabbing'; return; }
  spin.drag=true; spin.lastX=e.clientX; spin.lastT=performance.now(); spin.vel=0; canvas.className='spin';
});
canvas.addEventListener('pointermove', e=>{
  if (press.on && !grabC){
    if (Math.hypot(e.clientX-press.x, e.clientY-press.y) > 5 || performance.now()-press.t > 160){ grabC = press.c; withChar(grabC, ()=>ragGrab(press.part, press.hit, e.clientX, e.clientY)); }
  }
  if (grabC){ withChar(grabC, ()=>ragAim(e.clientX, e.clientY)); return; }
  if (spin.drag){
    const now=performance.now(), dx=e.clientX-spin.lastX; spin.lastX=e.clientX;
    spin.target += dx*0.011; spin.vel = dx*0.011/Math.max(1,(now-spin.lastT))*1000; spin.lastT=now; return;
  }
  // hover feedback (throttled)
  if (!hoverT){ hoverT = setTimeout(()=>{ hoverT=0; canvas.className = pickPart(mouse.x,mouse.y) ? 'can-grab' : ''; }, 70); }
});
let hoverT = 0;
const endPointer = ()=>{
  if (grabC){ withChar(grabC, ()=>ragRelease()); grabC = null; }
  else if (press.on){ if (press.c===active) react('poke',1); else bringToFront(press.c); }
  press.on=false;
  if (spin.drag){ spin.drag=false; spin.target += clamp(spin.vel,-14,14)*0.18; }
  canvas.className='';
};
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e=>{ e.preventDefault();
  if (grabC){ grabC.RAG.spinLeft = clamp((grabC.RAG.spinLeft||0) + Math.sign(e.deltaY)*0.55, -6, 6); return; }   // dangling: scroll turns him
  zoomT = clamp(zoomT - Math.sign(e.deltaY)*0.12, -1, 1); }, {passive:false});
addEventListener('pointermove', e=>{
  const now = nowS();
  const dx=e.clientX-mouse.x, dy=e.clientY-mouse.y; mouse.speed = Math.hypot(dx,dy);
  mouse.x=e.clientX; mouse.y=e.clientY; mouse.lastMove=now; mouse.inside=true; mouse.overUI = e.target!==canvas;
  mouse.ndc.copy(toNDC(e.clientX,e.clientY));
  if (!mouse.overUI && look.target===0 && now>look.cooldown && mouse.speed>6 && Math.random()<0.025){ look.target=1; look.until=now+rand(2.2,4.5); }
});
document.addEventListener('pointerleave', ()=>{ mouse.inside=false; });

/* ============================================================
   RAGDOLL  — Verlet point skeleton (torso box, head, 4 limbs)
   Grab any body part to lift him; he dangles from that point,
   falls when released, then gets back up.
   ============================================================ */
let RAG = { state:'off', t:0, P:null, C:[], pin:null, target:new THREE.Vector3(), aim:new THREE.Vector3(), plane:new THREE.Plane(), still:0, acc:0, saved:null };
const RAG_R = { sL:0.13, sR:0.13, hL:0.13, hR:0.13, top:0.22, handL:0.11, handR:0.11, footL:0.11, footR:0.11 };
const GRAB_SET = { head:['top'], torso:['sL','sR','hL','hR'], lArm:['handL','sL'], rArm:['handR','sR'], lLeg:['footL','hL'], rLeg:['footR','hR'] };
function ragSetup(){
  const pv = n => new THREE.Vector3().setFromMatrixPosition(mainRig.restChar[n]);
  const la=pv('Left_Arm'), ra=pv('Right_Arm'), ll=pv('Left_Leg'), rl=pv('Right_Leg');
  RAG.defs = [
    ['sL','Chest',la], ['sR','Chest',ra], ['hL','Chest',ll], ['hR','Chest',rl],
    ['top','Head',new THREE.Vector3(0,2.0,0)],
    ['handL','Left_Arm',new THREE.Vector3(la.x,0.8,0)], ['handR','Right_Arm',new THREE.Vector3(ra.x,0.8,0)],
    ['footL','Left_Leg',new THREE.Vector3(ll.x,0.04,0)], ['footR','Right_Leg',new THREE.Vector3(rl.x,0.04,0)],
  ].map(([n,b,c])=>({ n, b, c, local:c.clone().applyMatrix4(mainRig.restChar[b].clone().invert()) }));
  RAG.restC = Object.fromEntries(RAG.defs.map(d=>[d.n,d.c]));
  RAG.chest0 = pv('Chest'); RAG.g0 = la.clone().add(ra).add(ll).add(rl).multiplyScalar(0.25);
}
function ragInit(){
  const ms = mainRig.root.scale, S = CHAR_SCALE;
  const Wp = p => p.clone().multiply(ms).multiplyScalar(S);
  RAG.P = {};
  for (const d of RAG.defs){ const wp = d.local.clone().applyMatrix4(mainRig.bones[d.b].matrixWorld); RAG.P[d.n] = { pos:wp, prev:wp.clone(), r:RAG_R[d.n]*S, pinned:false }; }
  // start clear of the floor / desk: a first-step push-out would turn into a big Verlet kick
  let lift = 0; for (const p of Object.values(RAG.P)) lift = Math.max(lift, groundAt(p.pos.x, p.pos.z) + p.r - p.pos.y);
  if (lift > 0) for (const p of Object.values(RAG.P)){ p.pos.y += lift; p.prev.y += lift; }
  const C=[]; const L=(a,b,lo=1,hi=1)=>{ const d=Wp(RAG.restC[a]).distanceTo(Wp(RAG.restC[b])); C.push({a,b,lo:d*lo,hi:d*hi}); };
  const T=['sL','sR','hL','hR']; for(let i=0;i<4;i++) for(let j=i+1;j<4;j++) L(T[i],T[j]);
  L('top','sL'); L('top','sR'); L('top','hL',0.95,1.01); L('top','hR',0.95,1.01);
  L('handL','sL'); L('handR','sR'); L('footL','hL'); L('footR','hR');
  const M=(a,b,m)=>C.push({a,b,lo:m*S,hi:Infinity});
  M('handL','sR',0.6); M('handR','sL',0.6); M('handL','hR',0.35); M('handR','hL',0.35);
  M('footL','sL',0.6); M('footR','sR',0.6); M('footL','footR',0.16); M('footL','hR',0.2); M('footR','hL',0.2);
  RAG.C = C;
}
function ragGrab(part, point, x, y){
  if (RAG.state==='off' || RAG.state==='recover' || !RAG.P){ ragInit(); }
  const set = GRAB_SET[part] || ['top'];
  let best=set[0], bd=Infinity; for (const n of set){ const d=RAG.P[n].pos.distanceTo(point); if (d<bd){bd=d;best=n;} }
  for (const p of Object.values(RAG.P)) p.pinned=false;
  RAG.pin = { n:best, off:point.clone().sub(RAG.P[best].pos) };
  RAG.P[best].pinned = true;
  const n = camera.getWorldDirection(new THREE.Vector3()).negate();
  RAG.plane.setFromNormalAndCoplanarPoint(n, point);
  RAG.target.copy(point); RAG.aim.copy(point);
  if (camS.shot!=='totaal'){ camS.resume = camS.shot; goShot('totaal',{fast:true, keepAuto:true}); }
  bound.mv = null;
  RAG.state='grab'; RAG.t=0; RAG.still=0; RAG.acc=0;
  say(bound, 'dangle', true); bound.chatAt = nowS() + rand(2.4, 3.6);
  look.target=0; spin.drag=false; reactS.t = 99; bound.ryaw = 0; RAG.spinLeft = 0;
  ragAim(x,y);
}
function ragAim(x,y){
  pickRay.setFromCamera(toNDC(x,y), camera);
  if (pickRay.ray.intersectPlane(RAG.plane, _v)){ RAG.aim.copy(_v); RAG.aim.y = clamp(RAG.aim.y, 0.25, ROOM.H-0.9); RAG.aim.x = clamp(RAG.aim.x, -ROOM.W/2+0.6, ROOM.W/2-0.6); }
}
function ragRelease(){
  if (RAG.pin){ RAG.P[RAG.pin.n].pinned=false; RAG.pin=null; }
  // throws stay playful but never wild (max ~4 units/s)
  for (const p of Object.values(RAG.P)){ _v.subVectors(p.pos,p.prev); const m=4/120; if (_v.length()>m){ _v.setLength(m); p.prev.subVectors(p.pos,_v); } }
  // a small random shove so he tumbles instead of landing perfectly upright
  const t=RAG.P.top, k=0.012*CHAR_SCALE; t.prev.x -= (Math.random()-0.5)*2*k; t.prev.z -= (Math.random()*0.6+0.4)*k*(Math.random()<0.5?-1:1);
  RAG.state='fall'; RAG.t=0; RAG.still=0; RAG.spinLeft=0;
}
// the current room's desk blocks, as physics boxes (same clamp as buildRoom)
function physBlocks(){ const e = ENVS[envI]; if (!e.phys) e.phys = e.blocks.map(([x0,x1,z0,z1,h])=>({ x0, x1, z0:Math.max(z0,-e.D+0.05), z1, h, wallL:x0<=-ROOM.W/2+0.01, wallR:x1>=ROOM.W/2-0.01, wallB:z0<=-e.D+0.1 })); return e.phys; }
function groundAt(x, z){ let y = 0; for (const b of physBlocks()) if (x>b.x0+0.03 && x<b.x1-0.03 && z>b.z0+0.03 && z<b.z1-0.03) y = Math.max(y, b.h); return y; }
function dustHit(p, speed, y){
  if (speed < 1.6 || p.dustT > 0) return;
  p.dustT = 0.35; spawnDust(_dh.set(p.pos.x, y+0.005, p.pos.z), clamp((speed-1.6)/4, 0.15, 1));
}
const _dh = new THREE.Vector3();
function collideParticle(p){
  const r = p.r;

   CAMERA SHOTS — all stay close to the projector position so the
   projection-mapped room holds up; framing comes from aim + lens.
   ============================================================ */
const C0 = () => CHAR_POS;
const SHOTS = {
  totaal:   { name:'Totaal',    pos:()=>camBase.clone(),                                   look:()=>camAhead.clone(),                      fovK:1,    drift:0.35 },
  portret:  { name:'Portret',   pos:()=>new THREE.Vector3( 0.32, 1.52, C0().z+2.15),       look:()=>C0().clone().setY(1.46),               fovK:0.8, drift:1 },
  bovenlijf:{ name:'Bovenlijf', pos:()=>new THREE.Vector3(-0.38, 1.26, C0().z+2.5),        look:()=>C0().clone().setY(1.0),                fovK:0.86,  drift:0.9 },
  benen:    { name:'Benen',     pos:()=>new THREE.Vector3( 0.25, 0.85, C0().z+2.3),        look:()=>C0().clone().setY(0.55),               fovK:0.84, drift:0.9 },
  voeten:   { name:'Voeten',    pos:()=>new THREE.Vector3( 0.38, 0.6,  C0().z+2.1),        look:()=>C0().clone().setY(0.36),               fovK:0.8, drift:0.8 },
  held:     { name:'Held',      pos:()=>new THREE.Vector3(-0.38, 0.42, C0().z+2.9),        look:()=>C0().clone().setY(1.08),               fovK:0.95, drift:0.7 },
  zijkant:  { name:'Zijkant',   pos:()=>new THREE.Vector3( 1.2,  1.12, C0().z+2.2),        look:()=>C0().clone().setY(0.86),               fovK:1.0, drift:0.8 },
};
// how far each view can zoom in (1 + this): the close-ups are already close
const ZOOM_IN = { totaal:1.5, portret:0.3, bovenlijf:0.45, benen:0.45, voeten:0.35, held:0.6, zijkant:0.55 };
const SHOT_ORDER = ['totaal','portret','bovenlijf','benen','voeten','held','zijkant'];
const CAT_SHOT = { hair:'portret', hat:'portret', top:'bovenlijf', bottom:'benen', shoes:'voeten', acc:'bovenlijf', held:'zijkant' };
const camS = { shot:'totaal', auto:true, from:null, to:null, t:1, dur:1.25, cur:{ pos:new THREE.Vector3(), look:new THREE.Vector3(), fovK:1, drift:0.35 }, resume:null };
const shotState = id => ({ pos:SHOTS[id].pos(), look:SHOTS[id].look(), fovK:SHOTS[id].fovK, drift:SHOTS[id].drift });
function goShot(id, opts={}){
  if (!SHOTS[id]) return;
  if (!opts.keepAuto && opts.manual) setAuto(false);
  if (id===camS.shot && camS.t>=1 && !opts.force) return;
  camS.from = { pos:camS.cur.pos.clone(), look:camS.cur.look.clone(), fovK:camS.cur.fovK, drift:camS.cur.drift };
  camS.to = shotState(id); camS.shot = id; camS.t = 0;
  camS.dur = opts.fast ? 0.7 : 1.25;
  if (!opts.keepAuto || opts.manual) zoomT = 0;   // every view starts at its own framing
  document.querySelectorAll('#shots [data-shot]').forEach(b=>{ b.classList.toggle('on', b.dataset.shot===id); b.setAttribute('aria-pressed', b.dataset.shot===id); });
}
function setAuto(on){ camS.auto = on; $('#camAuto').classList.toggle('on', on); $('#camAuto').setAttribute('aria-pressed', on); if (on && curCat) goShot(CAT_SHOT[curCat]||'totaal'); }
function buildShotBar(){
  const bar = $('#shots');
  for (const id of SHOT_ORDER){ const b=document.createElement('button'); b.dataset.shot=id; b.textContent=SHOTS[id].name; b.onclick=()=>goShot(id,{manual:true}); bar.appendChild(b); }
  $('#camAuto').onclick = ()=>setAuto(!camS.auto);
  const st = shotState('totaal'); Object.assign(camS.cur, { pos:st.pos, look:st.look, fovK:1, drift:st.drift }); camS.from = camS.to = st;
  goShot('totaal',{force:true}); camS.t = 1;
}
const easeIO = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const _arrowP = new THREE.Vector3();
function placeArrows(W,H,z){
  // keep the rotate buttons beside the character whatever the shot
  const c = _arrowP.copy(CHAR_POS).setY(0.9*CHAR_SCALE).project(camera);
  const knee = CHAR_POS.clone().setY(0.42).project(camera);
  const cx = (c.x+1)/2*W, kneeY = (1-knee.y)/2*H;
  const edge = CHAR_POS.clone().add(new THREE.Vector3(0.95,0.42,0)).project(camera);
  const off = clamp(Math.abs((edge.x+1)/2*W - cx), 170*z, 250*z);
  const y = clamp(kneeY, H*0.5, H - 150*z);
  for (const [id,side] of [['#rotL',-1],['#rotR',1]]){ const el=$(id); el.style.left=((cx+side*off)/z-31)+'px'; el.style.top=(y/z-31)+'px'; }
}

/* ============================================================
   3D HAND CURSOR — extruded, bevelled hands with a black outline (inverted hull),
   white-to-blue gradient and a blue "1": pointing hand by default, open palm over
   someone you can pick up, a squeezed palm while holding someone.
   ============================================================ */
const USE_HAND_CURSOR = false;   // switched off for now: set to true to bring the 3D hand back
const HAND = (()=>{
  const cv = $('#hand3d'); if (!USE_HAND_CURSOR){ cv.remove(); return null; } let r;
  try { r = new THREE.WebGLRenderer({ canvas:cv, alpha:true, antialias:true }); } catch(e){ return null; }
  r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1,1,1,-1,-1000,1000);
  sc.add(new THREE.HemisphereLight(0xffffff, 0xb8c8e0, 1.35));
  const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(-0.6, 1, 1.2); sc.add(dl);
  const cap = (x1,y1,x2,y2,rr)=>{ const sh=new THREE.Shape(), a=Math.atan2(y2-y1,x2-x1); sh.absarc(x2,y2,rr,a-Math.PI/2,a+Math.PI/2,false); sh.absarc(x1,y1,rr,a+Math.PI/2,a+Math.PI*1.5,false); sh.closePath(); return sh; };
  const rrect = (x0,y0,x1,y1,rr)=>{ const sh=new THREE.Shape(); sh.moveTo(x0+rr,y0); sh.lineTo(x1-rr,y0); sh.quadraticCurveTo(x1,y0,x1,y0+rr); sh.lineTo(x1,y1-rr); sh.quadraticCurveTo(x1,y1,x1-rr,y1); sh.lineTo(x0+rr,y1); sh.quadraticCurveTo(x0,y1,x0,y1-rr); sh.lineTo(x0,y0+rr); sh.quadraticCurveTo(x0,y0,x0+rr,y0); return sh; };
  const EX = { depth:12, bevelEnabled:true, bevelThickness:6, bevelSize:4.5, bevelSegments:5, curveSegments:18 };
  const skin = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.38, metalness:0 });
  const ink = new THREE.MeshBasicMaterial({ color:0x111317, side:THREE.BackSide });
  const blue = new THREE.MeshStandardMaterial({ color:0x1e88ff, roughness:0.35 });
  const cTop = new THREE.Color(0xffffff), cBot = new THREE.Color(0xbcdcff), col = new THREE.Color();
  function build(shapes, label, hot){
    const g = new THREE.Group(), geos = shapes.map(sh=>new THREE.ExtrudeGeometry(sh, EX));
    let y0=Infinity, y1=-Infinity; for (const ge of geos){ ge.computeBoundingBox(); y0=Math.min(y0,ge.boundingBox.min.y); y1=Math.max(y1,ge.boundingBox.max.y); }
    for (const ge of geos){
      const p = ge.attributes.position, c = new Float32Array(p.count*3);
      for (let i=0;i<p.count;i++){ col.copy(cBot).lerp(cTop, smooth(0.08, 0.62, (p.getY(i)-y0)/(y1-y0))); c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b; }
      ge.setAttribute('color', new THREE.BufferAttribute(c,3));
      g.add(new THREE.Mesh(ge, skin));
      // outline: a slightly inflated copy drawn inside-out
      let o = ge.clone(); o.deleteAttribute('normal'); o.deleteAttribute('uv'); o.deleteAttribute('color'); o = mergeVertices(o, 0.01); o.computeVertexNormals();
      const op = o.attributes.position, on = o.attributes.normal;
      for (let i=0;i<op.count;i++) op.setXYZ(i, op.getX(i)+on.getX(i)*4.2, op.getY(i)+on.getY(i)*4.2, op.getZ(i)+on.getZ(i)*4.2);
      g.add(new THREE.Mesh(o, ink));
    }
    // the blue "1"
    const one = new THREE.Shape(); one.moveTo(-3.5,-13); one.lineTo(4.5,-13); one.lineTo(4.5,14); one.lineTo(-1,14); one.lineTo(-9,7); one.lineTo(-9,2); one.lineTo(-3.5,6); one.closePath();
    const m1 = new THREE.Mesh(new THREE.ExtrudeGeometry(one, { depth:2, bevelEnabled:true, bevelThickness:1, bevelSize:0.8, bevelSegments:2 }), blue);
    m1.position.set(label[0], label[1], EX.depth + EX.bevelThickness + 0.2); g.add(m1);
    const holder = new THREE.Group(); holder.add(g); sc.add(holder);
    return { holder, g, hot:new THREE.Vector3(hot[0], hot[1], EX.depth), w:0 };
  }
  // pointing hand: index finger up, three knuckles, thumb on the left
  const point = build([
    rrect(-15,-40, 36, 14, 13),
    cap(-3, 2, -3, 62, 11),
    cap(13, 4, 13, 16, 8.5), cap(25, 2, 25, 13, 8.5), cap(35, -2, 35, 8, 7.5),
    cap(-12, -14, -24, 4, 9.5),
  ], [12,-16], [-3, 72]);
  // open hand: palm, four fingers, thumb
  const open = build([
    rrect(-30,-42, 32, 10, 16),
    cap(-21, 2, -30, 50, 8), cap(-3, 4, -4, 60, 8.5), cap(15, 4, 21, 53, 8), cap(29, -2, 42, 36, 7.5),   // spread so the outline shows between fingers
    cap(-26, -18, -52, 6, 9),
  ], [1,-18], [0, -8]);
  const st = { x:-999, y:-999, vx:0, vy:0, tilt:new THREE.Vector2(), press:0, mode:'point', shown:false };
  addEventListener('pointermove', e=>{ if (e.pointerType!=='mouse') return; st.vx += e.clientX-st.x; st.vy += e.clientY-st.y; st.x=e.clientX; st.y=e.clientY; st.shown=true; }, {passive:true});
  addEventListener('pointerdown', e=>{ if (e.pointerType==='mouse') st.down = true; }, {passive:true});
  addEventListener('pointerup', ()=>{ st.down = false; }, {passive:true});
  document.addEventListener('pointerleave', ()=>{ st.shown=false; });
  document.documentElement.classList.add('hand3d');
  function resize(){ r.setSize(innerWidth, innerHeight, false); cam.left=-innerWidth/2; cam.right=innerWidth/2; cam.top=innerHeight/2; cam.bottom=-innerHeight/2; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const _h = new THREE.Vector3();
  return function update(dt){
    // which hand? open palm over someone grabbable, squeezed while holding, pointer otherwise
    const cls = canvas.className, holding = !!grabC || cls==='grabbing';
    st.mode = (holding || cls==='can-grab') ? 'open' : 'point';
    point.w = damp(point.w, st.shown && st.mode==='point' ? 1 : 0, 22, dt);
    open.w  = damp(open.w,  st.shown && st.mode==='open'  ? 1 : 0, 22, dt);
    st.press = damp(st.press, st.down ? 1 : 0, 25, dt);
    // tilt with movement, ease back
    st.tilt.x = damp(st.tilt.x, clamp(st.vy*0.02,-0.5,0.5), 10, dt); st.tilt.y = damp(st.tilt.y, clamp(st.vx*0.02,-0.6,0.6), 10, dt); st.vx = st.vy = 0;
    const S = window.__handS || 0.5;
    for (const hd of [point, open]){
      hd.holder.visible = hd.w > 0.02; if (!hd.holder.visible) continue;
      const grip = hd===open && holding ? 1 : 0;
      hd.g.rotation.set(-0.28 + st.tilt.x + grip*0.55 + st.press*0.25, 0.38 + st.tilt.y, -0.12 - st.tilt.y*0.3 + (hd===open ? 0.1 : 0));
      const k = S*(0.55 + 0.45*hd.w)*(1 - st.press*0.1)*(1 - grip*0.06);
      hd.g.scale.set(k, k*(1-grip*0.12), k);
      hd.holder.position.set(0,0,0); hd.holder.updateMatrixWorld(true);
      _h.copy(hd.hot).applyMatrix4(hd.g.matrixWorld);    // keep the hot spot exactly under the mouse
      hd.holder.position.set(st.x - innerWidth/2 - _h.x, innerHeight/2 - st.y - _h.y, 0);
    }
    r.render(sc, cam);
  };
})();
if (!HAND) document.documentElement.classList.remove('hand3d');

/* ============================================================
   LAYOUT + LOOP
   ============================================================ */
let baseFov = 45, baseYaw = 0, parallaxK = 1, layoutZ = 1;
const camBase = new THREE.Vector3(0, ROOM.camH, 0), camAhead = new THREE.Vector3(0, ROOM.camH, -ROOM.D);
function layout(){
  const W=innerWidth, H=innerHeight, wide = W>=820; renderer.setSize(W,H,false);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  // UI scale: designed at 1600×900, kept a touch smaller so the character stays the focus
  const z = wide ? clamp(Math.min(W/1600, H/900)*0.9, 0.58, 1) : clamp(W/560, 0.6, 0.82);
  document.documentElement.style.setProperty('--z', z.toFixed(3));
  if (wide) document.documentElement.style.setProperty('--gridMax', Math.max(170, H/z - 104 - 90 - 175 - 60)+'px');
  else document.documentElement.style.setProperty('--gridMax', Math.max(120, H*0.36/z - 120)+'px');
  const pr = $('#panel').getBoundingClientRect();
  // the room image "covers" the scene rect: whole screen on desktop, the area above the sheet on phones
  const rect = wide ? {w:W, h:H} : {w:W, h:Math.round(pr.top + 30)};
  const asp = rect.w/rect.h;
  const vt = (asp <= ROOM.ASPECT ? ROOM.VTAN : ROOM.VTAN*ROOM.ASPECT/asp) * 0.94;   // 6% margin for parallax
  baseFov = THREE.MathUtils.radToDeg(2*Math.atan(vt));
  camera.fov = baseFov; camera.aspect = asp; camera.zoom = 1;
  camera.setViewOffset(rect.w, rect.h, 0, 0, W, H);
  camera.updateProjectionMatrix();
  camera.position.copy(camBase); camera.lookAt(camAhead); camera.updateMatrixWorld(true);
  renderer.getDrawingBufferSize(wipeRes);
  parallaxK = wide ? 1 : 0.6;
  layoutZ = z;
  if (camS.to){ camS.to = shotState(camS.shot); }
}
addEventListener('resize', layout);

const clock = new THREE.Clock();
const _dir = new THREE.Vector3(), _dir2 = new THREE.Vector3(), _chest = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 1/20), now = nowS();
  useChar(active);

  // camera: eased blend between shots + slow handheld drift + mouse parallax + scroll zoom
  camS.t = Math.min(1, camS.t + dt/camS.dur); const ck = easeIO(camS.t);
  camS.cur.pos.lerpVectors(camS.from.pos, camS.to.pos, ck);
  camS.cur.look.lerpVectors(camS.from.look, camS.to.look, ck);
  camS.cur.fovK = camS.from.fovK + (camS.to.fovK-camS.from.fovK)*ck;
  camS.cur.drift = camS.from.drift + (camS.to.drift-camS.from.drift)*ck;
  // scroll: zoom in up to 3x on what this view frames, or out toward the whole room (stays inside the picture)
  zoom = damp(zoom, zoomT, 6, dt);
  const zIn = Math.max(0, zoom), zOut = smooth(0, 1, Math.max(0, -zoom));
  const pk = (SET.parallax ? parallaxK : 0)*(1-zOut*0.85)/(1+zIn*1.5), dr = camS.cur.drift*pk;
  par.x = damp(par.x, mouse.inside ? mouse.ndc.x : 0, 2.5, dt); par.y = damp(par.y, mouse.inside ? mouse.ndc.y : 0, 2.5, dt);
  camera.position.copy(camS.cur.pos).lerp(camBase, smooth(0,0.75,zOut)).add(_dir.set(
    par.x*0.2*pk + Math.sin(now*0.23)*0.05*dr + Math.sin(now*0.11+1.3)*0.03*dr,
    par.y*0.09*pk + Math.sin(now*0.31+0.7)*0.025*dr,
    Math.sin(now*0.17+2.1)*0.04*dr));
  _chest.copy(CHAR_POS).setY(1.15*CHAR_SCALE);
  const zk = smooth(0,1,zIn)*(camS.shot==='totaal' ? 0.85 : 0.3);
  camera.lookAt(_dir2.copy(camS.cur.look).lerp(camAhead, zOut).lerp(_chest, zk));
  const f = baseFov*(camS.cur.fovK + (1.05-camS.cur.fovK)*zOut)/(1+zIn*(ZOOM_IN[camS.shot] ?? 1)); if (Math.abs(camera.fov-f)>1e-3){ camera.fov = f; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld(true);
  placeArrows(innerWidth, innerHeight, layoutZ);
  updateWipe(dt);

  scene.updateMatrixWorld(true);
  for (const c of chars){ useChar(c); updateChar(dt, now); }
  useChar(active);

  // item pop-out
  for (let i=dying.length-1;i>=0;i--){ const h=dying[i]; h.userData.rt+=dt; const k=1-h.userData.rt/0.18;
    if (k<=0){ h.parent?.remove(h); disposeTree(h); dying.splice(i,1); } else h.userData.pxGroup.scale.setScalar(k*PX); }

  // particles
  for (let i=parts.length-1;i>=0;i--){ const p=parts[i], u=p.userData; u.t+=dt;
    if (u.t>u.life){ scene.remove(p); p.material.dispose(); parts.splice(i,1); continue; }
    if (u.dust){ u.v.multiplyScalar(Math.exp(-4*dt)); u.v.y += 0.25*dt; } else u.v.y -= 3.2*dt;
    p.position.addScaledVector(u.v, dt);
    p.rotation.x += u.spin.x*dt; p.rotation.y += u.spin.y*dt;
    const k = 1-u.t/u.life;
    if (u.dust){ p.scale.setScalar(u.s0*(1+1.8*(1-k))); p.material.opacity = 0.7*k*Math.min(1,u.t*12); }
    else { p.scale.setScalar(Math.max(0.01,k)); p.material.opacity = Math.min(1,k*1.5); } }

  renderer.render(scene, camera);
  updateBubbles();
  if (HAND) HAND(dt);
}
const elastic = x => x===1?1 : Math.pow(2,-9*x)*Math.sin((x*9-0.75)*(2*Math.PI)/3)+1;

init().catch(err=>{ console.error(err); $('#lerr').textContent = 'Could not load the character: '+err.message+' (serve this folder over http, e.g. node serve.js)'; });
</script>
</body>
</html>
