<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karakter maken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --z:1; --gridMax:420px;
    --ink:#1f2636; --ink-2:#3b4458; --muted:#8a93a6; --line:#d5dae4; --soft:#f2f4f8;
    --card:#ffffff; --blue:#2f7cf6; --blue-d:#1d5ccc; --green:#3f9b3a; --green-d:#2c7428; --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#c9d4e3;color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;z-index:1;display:block;cursor:default;touch-action:none}
  #stage.can-grab{cursor:grab} #stage.grabbing{cursor:grabbing} #stage.spin{cursor:ew-resize}
  #shade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 85% 95% at 50% 50%,transparent 60%,rgba(20,28,48,.18) 100%)}

  /* shared chunky card look */
  .ui{position:fixed;z-index:5;zoom:var(--z)}
  .box{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink)}
  .px{font-family:"Pixelify Sans",monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  button{font:inherit;color:inherit}
  button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  /* name */
  #nameCard{left:26px;top:22px;width:318px;display:flex;align-items:center;gap:16px;padding:12px 18px 12px 14px}
  #nameCard svg{width:50px;height:50px;flex:none;border-radius:4px;image-rendering:pixelated}
  #nameCard .lab{font-size:11px;color:var(--ink-2);margin-bottom:2px}
  #nameCard input{width:100%;border:0;border-bottom:2px dashed #9aa3b5;background:transparent;font:800 21px Nunito;color:var(--ink);padding:0 0 4px;outline:none}
  #nameCard input::placeholder{color:#59627a}
  #nameCard input:focus{border-bottom-color:var(--blue)}

  /* add / remove characters */
  #addChar{left:358px;top:34px} #delChar{left:426px;top:34px}
  #addChar b{position:absolute;right:-12px;bottom:-11px;background:var(--blue);color:#fff;border:2.5px solid var(--ink);border-radius:9px;font:800 11.5px Nunito;padding:1px 6px;line-height:1.3}
  #addChar:disabled{opacity:.5;cursor:default} #addChar:disabled:active{transform:none;box-shadow:0 5px 0 var(--ink)}
  #delChar.hide{display:none}

  /* body panel */
  #bodyCard{left:26px;top:144px;width:282px;padding:16px 18px 18px}
  #bodyCard .hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:left}
  #bodyCard h2,.ph h2{margin:0;font-size:21px;color:var(--ink)}
  #bodyCard .chev{font:900 14px Nunito;color:var(--muted);transition:transform .2s}
  #bodyCard.closed .chev{transform:rotate(-90deg)} #bodyCard.closed .bd{display:none}
  .fl{font:800 14px Nunito;color:var(--ink-2);display:flex;justify-content:space-between;margin:16px 0 8px}
  .fl b{font-weight:800;color:var(--ink)}
  #tones{display:flex;gap:8px}
  .tone{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);cursor:pointer;padding:0;transition:transform .1s}
  .tone:hover{transform:translateY(-2px)}
  .tone.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),#e1e5ee var(--p,50%))}
  input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),#e1e5ee var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d);margin-top:-6px}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d)}

  /* top-right tools */
  #tools{right:26px;top:22px;display:flex;gap:14px}
  .tbtn{width:56px;height:56px;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s}
  .tbtn.on{background:#e8f0ff;border-color:var(--blue);box-shadow:0 5px 0 var(--blue-d)} .tbtn.on svg{stroke:var(--blue-d)}
  .tbtn:hover{background:var(--soft)} .tbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .tbtn svg{width:26px;height:26px}
  #settings{right:26px;top:96px;width:260px;padding:14px 16px;display:none;z-index:8}
  #settings.open{display:block}
  #settings label{display:flex;justify-content:space-between;align-items:center;font:800 14px Nunito;padding:8px 0;cursor:pointer}
  #settings input{width:18px;height:18px;accent-color:var(--blue)}

  /* wardrobe */
  #panel{right:26px;top:104px;width:512px;display:flex;gap:14px;padding:16px 16px 18px 14px}
  #tabs{display:flex;flex-direction:column;gap:10px}
  .tab{width:56px;height:56px;border-radius:12px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s,transform .08s}
  .tab svg{width:28px;height:28px}
  .tab:hover{background:var(--soft)}
  .tab.on{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)} .tab.on svg rect{fill:#fff}
  .pc{flex:1;min-width:0;display:flex;flex-direction:column}
  .ph{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px}
  .ph h2{font-size:23px}
  .ph span{font:700 14px Nunito;color:var(--ink-2)}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:var(--gridMax);overflow-y:auto;padding:12px 6px 10px 4px;margin:-12px -6px 0 -4px;align-content:start;scrollbar-width:thin;scrollbar-color:#c3c9d6 transparent}
  .card{position:relative;background:#fff;border:2.5px solid #2a3242;border-radius:12px;box-shadow:0 4px 0 #2a3242;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:stretch;transition:transform .1s;text-align:center}
  .card:hover{transform:translateY(-2px)}
  .card .th{aspect-ratio:1/.8;display:grid;place-items:center;overflow:hidden;border-radius:10px 10px 0 0;background:radial-gradient(circle at 50% 45%,#fbfcfe,#eef1f6 80%)}
  .card .th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .card .th img.ok{opacity:1}
  .card .lbl{font:800 13.5px Nunito;padding:4px 6px 9px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .no{position:absolute;inset:0 0 28px;display:grid;place-items:center;font:900 40px Nunito;color:#c7ccd8;pointer-events:none}
  .card.on{border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
  .card .chk{position:absolute;top:-11px;right:-11px;width:30px;height:30px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blue-d);display:none;place-items:center}
  .card .chk svg{width:14px;height:14px}
  .card.on .chk{display:grid}
  .sep{border-top:2px dashed var(--line);margin:14px 0 10px}
  .kl{font:800 15px Nunito;color:var(--ink-2);margin:0 0 9px;display:flex;justify-content:space-between}
  .kl span{font-weight:700;color:var(--muted);font-size:13px}
  #colors{display:flex;flex-wrap:wrap;gap:9px;min-height:36px}
  .sw{width:36px;height:36px;border-radius:7px;border:2px solid var(--ink);cursor:pointer;padding:0;transition:transform .1s}
  .sw:hover{transform:translateY(-2px)}
  .sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--blue)}
  #colors .none{font:700 13px Nunito;color:var(--muted);align-self:center}

  /* rotate arrows (positioned next to the character by JS) */
  .rot{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s}
  .rot:hover{background:var(--soft)} .rot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .rot svg{width:28px;height:28px}

  /* camera shots */
  #shots{left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px}
  #shots button{border:0;background:none;height:40px;padding:0 13px;border-radius:9px;font:800 13.5px Nunito;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  #shots button:hover{background:var(--soft)}
  #shots button.on{background:var(--blue);color:#fff}
  #shots .auto{border:2px solid var(--line);height:36px}
  #shots .auto i{width:9px;height:9px;border-radius:50%;background:#c3c9d6;display:block}
  #shots .auto.on{border-color:var(--blue);background:#e8f0ff;color:var(--blue-d)} #shots .auto.on i{background:var(--green)}
  #shots .div{width:2px;height:26px;background:var(--line);margin:0 4px}
  #shots svg{width:16px;height:16px}
  .rot{transition:transform .08s,opacity .3s}

  /* bottom toolbar */
  #toolbar{left:50%;bottom:20px;transform:translateX(-50%);display:flex;padding:6px 10px}
  #toolbar button{width:100px;height:66px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;border-radius:10px;font:800 13px Nunito;color:var(--ink)}
  #toolbar button:hover:not(:disabled){background:var(--soft)}
  #toolbar button:disabled{color:#b3bac8;cursor:default}
  #toolbar svg{width:26px;height:26px}
  #cancel{right:226px;bottom:22px;width:62px;height:62px;display:grid;place-items:center;cursor:pointer;padding:0}
  #cancel svg{width:24px;height:24px}
  #done{right:26px;bottom:22px;width:184px;height:62px;border-radius:12px;border:3px solid var(--ink);background:var(--green);box-shadow:inset 0 -5px 0 var(--green-d),0 5px 0 var(--ink);color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .08s}
  #done:hover{filter:brightness(1.06)} #done:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 var(--green-d),0 1px 0 var(--ink)}
  #done svg{width:26px;height:26px}
  #cancel:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

  #toast{position:fixed;z-index:9;left:50%;top:24px;transform:translate(-50%,-160%);background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 20px;font-size:21px;box-shadow:0 5px 0 var(--ink);transition:transform .35s cubic-bezier(.2,1.4,.4,1);zoom:var(--z)}
  #toast.show{transform:translate(-50%,0)}

  /* speech bubbles above the characters */
  #bubbles{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .bub{position:absolute;left:0;top:0;transform-origin:50% 100%;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:6px 13px 7px;font:800 calc(17px*var(--z,1)) Nunito;color:var(--ink);white-space:nowrap;will-change:transform,opacity}
  .bub::before{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .bub::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
  .bub.dots{padding:9px 13px 10px;line-height:0} .bub.dots i{display:inline-block;width:calc(9px*var(--z,1));height:calc(9px*var(--z,1));border-radius:50%;background:var(--ink);margin:0 calc(3px*var(--z,1));animation:bubDot 1.3s ease-in-out infinite}
  .bub.dots i:nth-child(2){animation-delay:.18s} .bub.dots i:nth-child(3){animation-delay:.36s}
  @keyframes bubDot{0%,55%,100%{transform:none;opacity:.3}25%{transform:translateY(-5px);opacity:1}}
  .bub.loud{background:#fff3c4} .bub.loud::after{border-top-color:#fff3c4}
  /* 3D hand cursor (mouse only; the native cursor comes back if WebGL for it fails) */
  #hand3d{position:fixed;inset:0;z-index:40;pointer-events:none;width:100vw;height:100vh}
  @media (pointer:fine){ html.hand3d, html.hand3d *{cursor:none !important} }
  #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#e9eef5;transition:opacity .5s}
  #loading.gone{opacity:0;pointer-events:none}
  #loading .t{font-size:30px;text-align:center}
  #loading .bar{width:260px;height:20px;border:3px solid var(--ink);border-radius:8px;background:#fff;margin:14px auto 0;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--blue) 0 14px,#5b9bff 14px 28px);transition:width .2s}
  #loading .err{color:var(--red);font:800 14px Nunito;margin-top:12px;max-width:420px;text-align:center}

  /* phones: wardrobe becomes a bottom sheet with tabs in a row */
  @media (max-width:819px){
    #nameCard{left:10px;top:10px;width:230px;padding:8px 12px 8px 10px;gap:10px} #nameCard svg{width:36px;height:36px} #nameCard input{font-size:17px}
    #bodyCard{left:10px;top:88px;width:230px;padding:10px 14px}
    #tools{right:10px;top:10px;gap:8px} .tbtn{width:46px;height:46px}
    #addChar{left:250px;top:14px} #delChar{left:304px;top:14px}
    #settings{right:10px;top:70px}
    #panel{left:8px;right:8px;top:auto;bottom:88px;width:auto;flex-direction:column;gap:10px;padding:10px 10px 12px}
    #tabs{flex-direction:row;justify-content:space-between}
    .tab{width:46px;height:46px}
    #grid{grid-template-columns:repeat(4,1fr);gap:8px}
    .card .lbl{font-size:11px}
    #toolbar{left:8px;bottom:10px;transform:none;padding:4px}
    #shots{top:66px;left:8px;right:8px;transform:none;overflow-x:auto;scrollbar-width:none} #shots button{height:34px;padding:0 9px;font-size:12px}
    #toolbar button{width:54px;height:56px;font-size:0;gap:0}
    #cancel{right:150px;bottom:12px;width:54px;height:54px}
    #done{right:8px;bottom:12px;width:132px;height:54px;font-size:20px}
  }
  /* skill screen (opens after Klaar): the live character stays on the left, the tree sits on the right */
  html.skillmode .ui{opacity:0;pointer-events:none;transition:opacity .25s}
  .ui{transition:opacity .25s}
  #skills{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
  #skills.open{opacity:1;visibility:visible;transition:opacity .35s}
  html.skillmode #shade{opacity:0} #shade{transition:opacity .6s}
  #skills .z{zoom:var(--z);pointer-events:auto}
  #skBar{position:absolute;left:26px;right:26px;top:20px;display:flex;align-items:center;gap:6px;padding:6px}
  #skBar .tb{height:44px;padding:0 18px;border:0;border-radius:9px;background:none;font-size:15px;color:var(--ink-2);cursor:pointer}
  #skBar .tb:hover{background:var(--soft)} #skBar .tb.on{background:var(--blue);color:#fff;cursor:default}
  #skBar .key{font:800 11px Nunito;border:2px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--muted)}
  #skBar .sp{flex:1}
  #skBar .pts{display:flex;align-items:center;gap:10px;font:800 15px Nunito;color:var(--ink-2);padding-right:8px}
  #skBar .pts b{font:700 20px "Pixelify Sans",monospace;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px}
  #skName{position:absolute;left:5%;bottom:34px;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;font-size:22px}
  #skName i{width:34px;height:34px;border-radius:8px;background:var(--blue);display:grid;place-items:center} #skName svg{width:20px;height:20px}
  /* scrollable tree view: fills the right side, drag or scroll to look around */
  #skView{position:absolute;left:43%;right:0;top:0;bottom:0;overflow:auto;pointer-events:auto;cursor:grab;scrollbar-width:thin;scrollbar-color:#c3c9d6 transparent;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 130px,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 130px,#000 calc(100% - 40px),transparent 100%)}
  #skView.drag{cursor:grabbing} #skView.drag .skT{cursor:grabbing}
  #skTree{position:relative;zoom:var(--z);width:1000px;margin:0 auto;padding:150px 40px 190px}
  #skLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #skLines path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  #skLines .on{stroke:var(--ink)} #skLines .off{stroke:#a3abbb;stroke-dasharray:2 9} #skLines .ghost{stroke:#d0d5de;stroke-dasharray:2 9}
  .skRowP{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:110px}
  #skBase{margin-bottom:110px}
  /* endless filler rows: locked skills that aren't designed yet; a dotted line climbs from each panel to the row above */
  .skRowF{display:grid;gap:22px;margin:0 -120px 110px}
  .skRowF .skPanel{background:#f3f5f9;border-color:#c3c9d6;box-shadow:0 5px 0 #c3c9d6;display:flex;justify-content:space-around;padding:26px 10px 18px}
  .skRowF .skPanel .pt{background:#a9b1c1}
  .skRowF .skPanel::before{content:'';position:absolute;left:50%;top:-112px;height:104px;border-left:4px dotted #ccd2dc;margin-left:-2px}
  .skPanel.ghost::before{content:'';position:absolute;left:50%;top:-112px;height:104px;border-left:4px dotted #ccd2dc;margin-left:-2px}
  #skUp .skRowF:first-child .skPanel::before{display:none}
  .skRowF .skT{width:120px;cursor:pointer} .skRowF .skT .hx{width:78px;height:78px;border-radius:17px}
  .skRowF .skT .hx svg{width:42px;height:42px} .skRowF .skT .nm{font-size:13.5px;white-space:nowrap}
  .skRowP.ghosts{grid-template-columns:repeat(4,1fr);gap:22px;margin-left:-120px;margin-right:-120px}
  .skPanel{position:relative;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:28px 18px 22px}
  .skPanel .pt{position:absolute;top:-13px;left:18px;font-size:12px;background:var(--ink);color:#fff;border-radius:7px;padding:3px 9px}
  .skPanel.base{background:linear-gradient(#fff7e6,#ffeccc);display:flex;justify-content:space-around;margin:0 110px}
  .skPanel.br{background:#eef1f6;border-color:#a9b1c1;box-shadow:0 5px 0 #a9b1c1;display:flex;justify-content:space-around}
  .skPanel.br .pt{background:#8a93a6}
  .skPanel.ghost{background:#f6f7fa;border:3px dashed #d0d5de;box-shadow:none;height:150px;display:flex;justify-content:space-around;align-items:center}
  .skPanel.ghost .pt{background:#d0d5de}
  .skPanel.ghost i{width:64px;height:64px;border-radius:16px;border:3px dashed #d0d5de;display:grid;place-items:center;font:700 26px "Pixelify Sans",monospace;color:#c4cad5;font-style:normal}
  #skHint{position:absolute;right:190px;bottom:36px;font:800 13px Nunito;color:var(--muted);zoom:var(--z);background:rgba(255,255,255,.92);border-radius:8px;padding:5px 10px}
  /* double-click: one skill opened big over the tree */
  #skFocus{position:absolute;left:45%;right:26px;top:96px;bottom:96px;display:flex;flex-direction:column;justify-content:center;padding:40px 54px;pointer-events:auto;
    opacity:0;visibility:hidden;transform:scale(.6);transition:opacity .2s,transform .32s cubic-bezier(.2,1.3,.4,1),visibility 0s .32s}
  #skFocus.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .32s cubic-bezier(.2,1.3,.4,1)}
  #skFocus .in{zoom:var(--z);display:flex;flex-direction:column;gap:26px}
  #skFocus .top{display:flex;align-items:center;gap:34px}
  #skFocus .hx{width:190px;height:190px;flex:none;border-radius:34px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center}
  #skFocus .hx svg{width:110px;height:110px}
  #skFocus h2{margin:0 0 10px;font-size:46px;line-height:1.05}
  #skFocus .chip{display:inline-block;font:800 15px Nunito;color:#fff;background:var(--blue);border:2.5px solid var(--ink);border-radius:8px;padding:3px 12px}
  #skFocus.locked .chip{background:#8a93a6} #skFocus.locked .hx{background:#dfe4ec;border-color:#a9b1c1;box-shadow:0 7px 0 #a9b1c1} #skFocus.locked .hx svg{opacity:.4;filter:grayscale(1)}
  #skFocus .meter{display:flex;align-items:center;gap:18px}
  #skFocus .bar{flex:1;height:30px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
  #skFocus .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--c) 0 18px,var(--c2) 18px 36px);transition:width .9s cubic-bezier(.25,.9,.3,1)}
  #skFocus .fpct{font:700 34px "Pixelify Sans",monospace;min-width:96px;text-align:right}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TPL_URL   = '../Template_Character/Cristiano_Template.obj';   // the template character (unrigged OBJ, rigged in code below)
const SKIN_URL  = '../steve/T_Steve.png';   // still feeds the skin-tone palette
const IDLE_URL  = '../steve/idle_animation_mixamo.fbx';
const PX = 1/16;               // one skin pixel in world units (Steve is 32px = 2 units tall)
const $ = s => document.querySelector(s);
let simSkew = 0; const nowS = () => performance.now()/1000 + simSkew;   // one clock for all timing (the debug stepper can advance it)
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const damp = (a,b,l,dt) => a + (b-a)*(1-Math.exp(-l*dt));
const smooth = (e0,e1,x) => { const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const canvas = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);

function addLights(s, shadows){
  // classroom: bright overhead panels + daylight windows on both sides
  s.add(new THREE.HemisphereLight(0xf1f5ff, 0x9a9ca3, 1.75));
  const key = new THREE.DirectionalLight(0xfff6ea, 2.1);
  key.position.set(0.9, 6, 2.4);
  if (shadows){
    key.castShadow = true; key.shadow.mapSize.set(1024,1024);
    Object.assign(key.shadow.camera, {left:-1.4,right:1.4,top:1.4,bottom:-1.4,near:1,far:14});
    key.shadow.bias = -0.0006; key.shadow.normalBias = 0.02; key.shadow.radius = 6;
  }
  s.add(key); s.userData.key = key;
  const winL = new THREE.DirectionalLight(0xdbe8ff, 1.15); winL.position.set(-5, 2.6, -1.5); s.add(winL);
  const winR = new THREE.DirectionalLight(0xdbe8ff, 1.0);  winR.position.set(5, 2.6, -1.5); s.add(winR);
  const back = new THREE.DirectionalLight(0xbcd6ff, 0.7);  back.position.set(0, 3, -6); s.add(back);
}
/* main scene: most light comes from an environment map captured from the projected room;
   a soft overhead key for form + shadow, and two rim lights from the windows behind.
   Every environment has its own preset for these (see ENVS). */
const hemi = new THREE.HemisphereLight(0xf4f7ff, 0xc9ccd2, 0.35); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff3e2, 1.15);
key.castShadow = true; key.shadow.mapSize.set(2048,2048);   // fixed size: resizing at runtime corrupted the shadow
Object.assign(key.shadow.camera, {left:-1.3,right:1.3,top:1.3,bottom:-1.3,near:1,far:16});
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.02; key.shadow.radius = 10; key.shadow.blurSamples = 16;
scene.add(key);
const rimL = new THREE.DirectionalLight(0xe4eeff, 3.4), rimR = new THREE.DirectionalLight(0xeef3ff, 2.6);
scene.add(rimL, rimR);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // VSM bled light (halos) under characters off the floor
const CHAR_SCALE = 0.86, CHAR_POS = new THREE.Vector3(0, 0, -4.4);   // the front spot: centred in the aisle, kid-sized next to the desks
// where characters stand: the front one is being edited, the others queue up behind him
const SLOTS = [[0,-4.4],[0.85,-5.6],[-0.85,-5.7],[0.05,-6.0],[-1.35,-4.95]].map(([x,z])=>new THREE.Vector3(x,0,z));
const MAX_CHARS = SLOTS.length;
const lightTgt = new THREE.Object3D(); scene.add(lightTgt);
key.target = lightTgt; rimL.target = lightTgt; rimR.target = lightTgt;

/* ---- Rooms: GREYBOX. Plain grey blockout boxes with a world-space grid, lit like a dev room.
   Stand-ins for the final art: walls/floor/ceiling shell, desks (physics) and a few props (visual only).
   ROOM.VTAN / ASPECT are the framing the camera was tuned to (the old background camera). Units: Steve = 2 tall. */
const ROOM = { W:5.2, H:3.6, D:7.2, camH:1.28, VTAN:722/1679, ASPECT:2912/1632 };
const wipeRes = new THREE.Vector2(1,1);
// grey standard material + 25 cm / 1 m grid lines; wipe: mode 1 = incoming room (left of the edge), 2 = outgoing (right of it)
const ROOM_WHITE = { value:0 };   // 0..1: fades every room to pure white (skill screen)
function makeRoomMat(color, u){
  const m = new THREE.MeshStandardMaterial({ color, roughness:0.9, metalness:0, side:THREE.DoubleSide });
  m.uniforms = u;
  m.onBeforeCompile = sh=>{
    Object.assign(sh.uniforms, u); sh.uniforms.white = ROOM_WHITE;
    sh.vertexShader = sh.vertexShader

/* ============================================================
   TEMPLATE CHARACTER — rigged in code from the segmented OBJ.
   Same bone names as the old block rig (World_Bone > Chest > Head / arms / legs) plus elbows,
   so idle retargeting, ragdoll, reactions and walking all keep working. Every part is bound
   100% to one bone (rigid, like an action figure). Units: 2 = top of the cap, faces +Z, his left = +X.
   ============================================================ */
const TPL_CREASE = THREE.MathUtils.degToRad(70);   // smoothing angle for the template's normals
const TPL_BONES = ['World_Bone','Chest','Head','Left_Arm','Right_Arm','Left_Elbow','Right_Elbow','Left_Leg','Right_Leg','Left_Knee','Right_Knee'];
function buildTemplate(obj){
  const src = {}; obj.traverse(o=>{ if (o.isMesh) src[o.name.toLowerCase()] = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry; });
  const part = key => { const k = Object.keys(src).find(n=>n.includes(key)); if (!k) throw new Error('template part missing: '+key); return src[k]; };
  const all = new THREE.Box3(); for (const g of Object.values(src)){ g.computeBoundingBox(); all.union(g.boundingBox); }
  const torso0 = part('torso'); torso0.computeBoundingBox();
  const S = 2/(all.max.y-all.min.y), y0 = all.min.y, zc = (torso0.boundingBox.min.z+torso0.boundingBox.max.z)/2;
  // copy (one side of) a part into char space: side +1 = his left (+X), -1 = right, 0 = everything
  const cut = (g, side=0) => {
    const p = g.attributes.position, n = g.attributes.normal, P = [], N = [];
    for (let t=0; t<p.count; t+=3){
      const cx = p.getX(t)+p.getX(t+1)+p.getX(t+2);
      if (side && Math.sign(cx)!==side) continue;
      for (let k=0;k<3;k++){ const i=t+k; P.push(p.getX(i)*S, (p.getY(i)-y0)*S, (p.getZ(i)-zc)*S); if (n) N.push(n.getX(i), n.getY(i), n.getZ(i)); }
    }
    const o = new THREE.BufferGeometry(); o.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
    if (n) o.setAttribute('normal', new THREE.Float32BufferAttribute(N,3)); else o.computeVertexNormals();
    o.computeBoundingBox(); return o;
  };
  const merge = gs => { const m = mergeGeometries(gs); m.computeBoundingBox(); return m; };
  // keep the triangles above (or below) a height, plus a small overlap band
  const splitY = (g, y, above, ov=0.035) => {
    const p = g.attributes.position, n = g.attributes.normal, Pp = [], Nn = [];
    for (let t=0; t<p.count; t+=3){
      const cy = (p.getY(t)+p.getY(t+1)+p.getY(t+2))/3;
      if (above ? cy < y-ov : cy > y+ov) continue;
      for (let k=0;k<3;k++){ Pp.push(p.getX(t+k), p.getY(t+k), p.getZ(t+k)); Nn.push(n.getX(t+k), n.getY(t+k), n.getZ(t+k)); }
    }
    const o = new THREE.BufferGeometry(); o.setAttribute('position', new THREE.Float32BufferAttribute(Pp,3)); o.setAttribute('normal', new THREE.Float32BufferAttribute(Nn,3)); o.computeBoundingBox(); return o;
  };
  const bb = g => g.boundingBox, mid = (a,b) => (a+b)/2;
  // centre of the vertices near the top of a piece (legs flare out, so the bbox centre isn't the hip)
  const topCentre = (g, band) => { const p=g.attributes.position, top=bb(g).max.y, c=new THREE.Vector3(); let n=0;
    for (let i=0;i<p.count;i++) if (p.getY(i) > top-band){ c.x+=p.getX(i); c.z+=p.getZ(i); n++; } return c.divideScalar(Math.max(1,n)); };

  const head = merge([cut(part('head')), cut(part('neck'))]), cap = cut(part('hat')), torso = cut(torso0);
  const side = s => ({ ua:cut(part('upperarm'),s), fa:merge([cut(part('forearm'),s), cut(part('fist'),s)]), fist:cut(part('fist'),s), leg:cut(part('legs'),s), shoe:cut(part('choes'),s) });
  const L = side(1), R = side(-1);
  // joint pivots (char space)
  const neckB = bb(cut(part('neck'))), tb = bb(torso);
  const P = {
    World_Bone: new THREE.Vector3(0,0,0),
    Chest:      new THREE.Vector3(0, tb.min.y + 0.05*(tb.max.y-tb.min.y), 0),
    Head:       new THREE.Vector3(0, neckB.min.y + 0.3*(neckB.max.y-neckB.min.y), mid(neckB.min.z, neckB.max.z)),
  };
  for (const [nm, d] of [['Left',L],['Right',R]]){
    const ua = bb(d.ua), fa = bb(d.fa), lt = topCentre(d.leg, 0.12), lg = bb(d.leg);
    P[nm+'_Arm']   = new THREE.Vector3(mid(ua.min.x,ua.max.x), ua.max.y - 0.18*(ua.max.y-ua.min.y), mid(ua.min.z,ua.max.z));
    P[nm+'_Elbow'] = new THREE.Vector3(mid(fa.min.x,fa.max.x), (ua.min.y + bb(cut(part('forearm'), nm==='Left'?1:-1)).max.y)/2, mid(fa.min.z,fa.max.z));
    P[nm+'_Leg']   = new THREE.Vector3(lt.x, lg.max.y - 0.06*(lg.max.y-lg.min.y), lt.z);
    const ky = bb(d.shoe).max.y + 0.45*(P[nm+'_Leg'].y - bb(d.shoe).max.y), kc = new THREE.Vector3(); let kn = 0;

/* ============================================================
   IDLE RETARGET  (Mixamo FBX → Steve's 6-bone block rig)
   Works with deltas from the clip's average pose, so rest-pose
   differences (T-pose vs arms-down) don't matter.
   ============================================================ */
const nrm = n => n.toLowerCase().replace(/^mixamorig[:_]?/,'').replace(/[^a-z0-9]/g,'');

/* The block rig has no elbows/knees/spine, so each Steve bone takes the overall direction

  if (!clip || !clip.tracks.length) throw new Error('No animation tracks in FBX');
  // duplicate bone names exist; the mixer binds the first one found, so do the same
  const src = {}; fbx.traverse(o=>{ if (o.isBone && !src[nrm(o.name)]) src[nrm(o.name)] = o; });
  const need = ['hips','neck','head','leftarm','rightarm','lefthand','righthand','leftupleg','rightupleg','leftfoot','rightfoot'];
  for (const n of need) if (!src[n]) throw new Error('FBX missing bone '+n);

  const F = new THREE.Quaternion().setFromUnitVectors(L, new THREE.Vector3(1,0,0));
  const top = (src.headtopend||src.head).getWorldPosition(new THREE.Vector3()).y;
  const foot = Math.min(...['lefttoebase','righttoebase','leftfoot','rightfoot'].filter(n=>src[n]).map(n=>src[n].getWorldPosition(new THREE.Vector3()).y));

function applyRetarget(dt){

  if (mirrored) _v.x = -_v.x;

  // knees only bend when something asks for it (walking, landing crouch, squat)

let footPts = [];
function setupFeet(){

    const inv = mainRig.restChar[n].clone().invert();
    if (tpl){ const kn = n.replace('Leg','Knee'), kinv = mainRig.restChar[kn].clone().invert(), [x0,x1,z0,z1] = n==='Left_Leg' ? tpl.feetL : tpl.feetR; return [mainRig.bones[kn], [[x0,z0],[x1,z0],[x0,z1],[x1,z1]].map(([x,z])=>new THREE.Vector3(x,0,z).applyMatrix4(kinv))]; }
    const x = new THREE.Vector3().setFromMatrixPosition(mainRig.restChar[n]).x;
    return [mainRig.bones[n], [[-.12,-.12],[.12,-.12],[-.12,.12],[.12,.12]].map(([dx,dz])=>new THREE.Vector3(x+dx,0,dz).applyMatrix4(inv))];

function updateChar(dt, now){
  const c = bound;

    if (c.appear < 0){
      c.wait = (c.wait||0) + dt;
      const blocked = chars.some(o=>o!==c && o.place.pos.distanceTo(c.slot) < 0.7);
      if (blocked && c.wait < 1.0){ turntable.visible = blob.visible = false; return; }

  bookSwap(c, now);
  if (c.book && SKT.open && c===active && now > (c.dotsAt||0)){ showDots(c, rand(4.5, 6.5)); c.dotsAt = c.bubble ? c.bubble.until + rand(2, 3.5) : now + 3; }
  if (!SKT.open && c.bubble && c.bubble.el.classList.contains('dots') && c.bubble.until > now + 0.1) c.bubble.until = now;
  if (c.sayAt && now >= c.sayAt){ c.sayAt = 0; if (SKT.open) say(c, c.sayCat, true); }
  const thinking = SKT.open && c===active;
  if (!thinking && now - lastInput > 4 && now > c.fidgetAt && !c.mv && RAG.state==='off' && c.appear >= 1 && !(REACT[reactS.key] && reactS.t < REACT[reactS.key].T)){

  if (!ragOn){ moveChar(dt); turntable.position.copy(c.place.pos); turntable.rotation.y = c.place.yaw; bounce.quaternion.setFromEuler(_eu.set(c.tilt, c.ryaw||0, 0, 'YXZ')); }

  if (ragOn){
    bounce.scale.set(1,1,1); bounce.position.y = 0; turntable.updateMatrixWorld(true); bounce.getWorldQuaternion(ttInv).invert();

  }
}

function frontSign(root){
  let head; root.traverse(o=>{ if (o.isMesh && /^head$/i.test(o.name)) head=o; });
  if (!head) return 1;
  // compare the skinned, world-space centre of the face texels against the head centre
  root.updateMatrixWorld(true);
  const g=head.geometry, uv=g.attributes.uv, idx=g.index;
  const P = i => head.localToWorld(head.getVertexPosition(i, new THREE.Vector3()));
  const centre = new THREE.Vector3(); for (let i=0;i<uv.count;i++) centre.add(P(i)); centre.divideScalar(uv.count);
  const tri = idx ? i=>idx.getX(i) : i=>i; const count = idx? idx.count : uv.count;
  for (let t=0;t<count;t+=3){
    let u=0,v=0; for(let k=0;k<3;k++){ u+=uv.getX(tri(t+k)); v+=uv.getY(tri(t+k)); }
    u=u/3*64; v=v/3*64;
    if (u>8&&u<16&&v>8&&v<16){ const c=P(tri(t)).add(P(tri(t+1))).add(P(tri(t+2))).divideScalar(3); return Math.sign(c.z-centre.z)||1; }
  }
  return 1;
}

let BASE_ORIG = null, SKIN0 = null;
let body = { tone:1, height:50, build:50, size:50 };
const TONES = () => [0xf3d8c0, 0xefc39d, 0xcf9a6c, (SKIN0[0]<<16)|(SKIN0[1]<<8)|SKIN0[2], 0x8a5634, 0x58361f];
let appliedTone = -1;
function recolorSkin(toneHex){
  const d = new Uint8ClampedArray(BASE_ORIG.data); const t = rgb(toneHex);
  const lum = c => 0.299*c[0]+0.587*c[1]+0.114*c[2];
  const l0 = lum(SKIN0), s0 = SKIN0[0]+SKIN0[1]+SKIN0[2], n0 = SKIN0.map(v=>v/s0);
  const regions = [[0,0,32,16],[40,16,16,16],[32,48,16,16],[16,16,24,16]];
  for (const [rx,ry,rw,rh] of regions) for (let y=ry;y<ry+rh;y++) for (let x=rx;x<rx+rw;x++){
    const i=(y*64+x)*4; if (d[i+3]<128) continue; const c=[d[i],d[i+1],d[i+2]]; const l=lum(c); const s=c[0]+c[1]+c[2]||1;
    if (l < l0*0.42 || l > l0*1.75) continue;
    if (Math.hypot(c[0]/s-n0[0], c[1]/s-n0[1], c[2]/s-n0[2]) > 0.06) continue;
    const k = l/l0; d[i]=clamp(t[0]*k,0,255); d[i+1]=clamp(t[1]*k,0,255); d[i+2]=clamp(t[2]*k,0,255);
  }
  BASE = new ImageData(d,64,64); SKIN = t; SKIN_D = shadeRGB(t,0.85);
}

  if (appliedTone !== body.tone){ if (body.tone===3){ BASE = new ImageData(new Uint8ClampedArray(BASE_ORIG.data),64,64); SKIN = SKIN0.slice(); SKIN_D = shadeRGB(SKIN,0.85); } else recolorSkin(TONES()[body.tone]); appliedTone = body.tone; if (bound===active){ thumbCache.clear(); if (curCat) selectCat(curCat); } refreshTexture(); }
  const h = 0.9 + body.height/100*0.22, b = 0.86 + body.build/100*0.32;
  const z = body.size < 50 ? 0.75 + body.size/50*0.25 : 1 + (body.size-50)/50*0.4;   // 0.75x … 1.4x
  mainRig.root.scale.set(b*z, h*z, b*z);
}

function commit(){

  applyBody(); refreshTexture(); glow = 1; syncVoxels(mainRig,outfit,voxMat,true); react(key,0.8);
  selectCat(curCat); syncBodyUI(); save();
}
function updToolbar(){ $('#undo').disabled = hist.i<=0; $('#redo').disabled = hist.i>=hist.stack.length-1; }
$('#undo').onclick = ()=>{ if (hist.i>0){ hist.i--; applyState(hist.stack[hist.i]); updToolbar(); } };
$('#redo').onclick = ()=>{ if (hist.i<hist.stack.length-1){ hist.i++; applyState(hist.stack[hist.i]); updToolbar(); } };

function randomOutfit(){
  const o = DEFAULT_OUTFIT();
  for (const c of CATS){
    if (c.hidden) continue;
    const list = ITEMS.filter(i=>i.cat===c.id && i.variants && !i.hidden);
    if (c.multi){ for (const it of list) if (Math.random()<0.35){ const vi=Math.floor(Math.random()*it.variants.length); o.acc[it.id]=vi; o.v[it.id]=vi; } continue; }
    if (Math.random() < (c.id==='hat'||c.id==='held'?0.45:0.15)) continue;
    const it = list[Math.floor(Math.random()*list.length)]; const vi=Math.floor(Math.random()*it.variants.length);
    o[c.id]=it.id; o.v[it.id]=vi;
  }
  if (o.hat==='tophat'||o.hat==='crown') if (o.hair==='afro'||o.hair==='bun'||o.hair==='spiky') o.hair='hair-none';
  return o;
}
$('#dice').onclick = ()=>{
  outfit = randomOutfit(); refreshTexture(); glow = 1; syncVoxels(mainRig,outfit,voxMat,true);
  const pool = DICE_CLIPS.filter(k=>k!==lastDice); lastDice = pool[Math.floor(Math.random()*pool.length)]; react(lastDice, 1);
  if (Math.random() < 0.5) say(active, 'dressed', true);
  othersWatch(active, [2,3.2]); for (const o of chars) if (o!==active && Math.random()<0.55) cue(o, Math.random()<0.75 ? 'clap' : 'cheer', rand(0.35,0.8), 0.8);
  spawnAt(bounce.localToWorld(new THREE.Vector3(0,1.1,0.2)), [0xffffff,0xffd335,0x2f7cf6,0xff5c7a], 26, 1.4);
  selectCat(curCat); commit();
};
$('#reset').onclick = ()=>{ outfit = DEFAULT_OUTFIT(); body = {tone:1,height:50,build:50,size:50}; applyBody(); syncBodyUI(); refreshTexture(); syncVoxels(mainRig,outfit,voxMat,true); react('off',1); selectCat(curCat); commit(); };
$('#rotL').onclick = ()=> spin.target -= Math.PI/4;
$('#rotR').onclick = ()=> spin.target += Math.PI/4;
$('#cancel').onclick = ()=>{ if (savedState && savedState!==snap()){ applyState(savedState); commit(); toast('Teruggezet'); } else react('off',0.8); };

  savedState = snap(); save(); react('cheer',1);

// fly-by: start high up in the tree, rush down through the rows and ease onto the unlocked skills
function skillIntro(){
  const v = $('#skView');
  const target = ()=>{ const vr = v.getBoundingClientRect(), br = $('#skBase').getBoundingClientRect(); return v.scrollTop + (br.top + br.height/2) - (vr.top + vr.height*0.52); };   // unlocked skills just below the middle
  const end = target(), start = Math.max(0, end - 3600*(layoutZ||1));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ v.scrollTop = end; return; }
  SKT.intro = true; v.scrollTop = start; const t0 = performance.now(), dur = 1900;
  const stop = ()=>{ SKT.intro = false; v.removeEventListener('wheel', stop); v.removeEventListener('pointerdown', stop); };
  v.addEventListener('wheel', stop, {passive:true}); v.addEventListener('pointerdown', stop);
  const tick = now=>{ if (!SKT.intro || !SKT.open) return stop();
    const k = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-k, 4);
    v.scrollTop = start + (end-start)*e;
    v.style.filter = k < 0.75 ? `blur(${(1-e)*2.2}px)` : '';
    if (k < 1) requestAnimationFrame(tick); else { v.style.filter = ''; stop(); } };
  requestAnimationFrame(tick);
}

function ragGrab(part, point, x, y){

function ragAim(x,y){

  const pool = chars.filter(o=>o!==c && o.turntable.visible && o.RAG.state==='off');

/* ============================================================
   PROCEDURAL LAYER: look-at, equip reactions, hold pose, blink
   ============================================================ */
let look = { w:0, target:0, until:0, next:2.5, cooldown:0, yaw:0, pitch:0 };
let reactS = { t:99, key:null, amp:1 };
let glow = 0, holdW = 0;
const DICE_CLIPS = ['cheer','twirl','flex','dab','bow','shimmy','jacks','model']; let lastDice = 'cheer';
const CLOTHING_CLIPS = new Set(['hair','hat','top','bottom','shoes','shades','chain','backpack','scarf','football','brick','bat']);
const FIDGETS = ['stretch','lookaround','scratch','shift','tap','yawn'];
const THINK_CLIPS = ['chin','ponder','temple','glance','hmm','count','scratch'];
const BOOK_CLIPS = ['read','read','glance','ponder','hmm','temple'];   // with the book: mostly reading   // skill tree idles
let lastThink = '';
function react(key, amp=1){ if (!SET.react && CLOTHING_CLIPS.has(key)) return; reactS.t=0; reactS.key=key; reactS.amp=amp; }
const raycaster = new THREE.Raycaster(); const plane = new THREE.Plane();
let blink = { next:3, until:0, on:false };


function proceduralPose(dt, now){
  const B = mainRig.bones;
  // --- look-at scheduling: every so often, watch the cursor for a few seconds
  if (look.target===0 && now>look.next){ look.target=1; look.until=now+rand(2.5,5.5); }
  if (look.target===1 && (now>look.until || now-mouse.lastMove>7 || !mouse.inside)){ look.target=0; look.next=now+rand(3.5,9); look.cooldown=now+1.5; }
  const W = bound.watch, getup = !!(bound.mv && bound.mv.type==='getup');
  const watching = !!(W && now >= W.from && now < W.until && chars.includes(W.c) && W.c.turntable.visible && !getup);
  const mouseLook = SET.look && look.target && !(bound.bookW > 0.3) && !spin.drag && !press.on && !mouse.overUI && !getup;
  const wantW = (watching || mouseLook) ? 1 : 0;
  look.w = damp(look.w, wantW, wantW? 2.2 : (mouse.overUI? 3.5 : 1.6), dt);

  // target point in char space
  let tYaw=0, tPitch=0;
  if (look.w>0.001){
    const head = B.Head.getWorldPosition(new THREE.Vector3()); head.y += 0.25;
    const toCam = camera.position.clone().sub(head).normalize();
    plane.setFromNormalAndCoplanarPoint(toCam, head.clone().addScaledVector(toCam, 1.6));
    raycaster.setFromCamera(mouse.ndc, camera);
    const hit = new THREE.Vector3(); let ok = false;
    if (watching){ W.c.mainRig.bones.Head.getWorldPosition(hit); hit.y += 0.3; ok = true; }
    else if (mouseLook) ok = !!raycaster.ray.intersectPlane(plane, hit);
    if (ok) (look.lastHit = look.lastHit || new THREE.Vector3()).copy(hit);
    else if (look.lastHit){ hit.copy(look.lastHit); ok = true; }
    if (ok){

      const d = tc.sub(hc); const yaw = Math.atan2(d.x, d.z), pitch = Math.atan2(d.y, Math.hypot(d.x,d.z));
      const behind = smooth(2.3, 1.5, Math.abs(yaw));          // don't break the neck when facing away

  }
  look.yaw = damp(look.yaw, tYaw*look.w, 7, dt);
  look.pitch = damp(look.pitch, tPitch*look.w, 7, dt);

  // --- reaction clip for whatever was just put on
  reactS.t += dt;
  const RC = REACT[reactS.key]; let o = {}, w = 0;
  if (RC && reactS.t < RC.T){ o = RC.f(reactS.t); w = smooth(0,0.08,reactS.t) * (1-smooth(RC.T-0.25,RC.T,reactS.t)) * reactS.amp; }
  bound.ryaw = o.yaw || 0;
  const mp = bound.pose || NOPOSE;   // walking / getting-up layer
  const g = (k,i) => ((o[k] && o[k][i]) || 0) * w + ((mp[k] && mp[k][i]) || 0);

  // squash & hop (a soft settle on every change + clip-specific hops/squats)
  const t = reactS.t;
  const sq = (t<1.0 ? 0.03*reactS.amp*Math.exp(-5*t)*Math.cos(13*t) : 0) + (o.sq||0)*w;

  bounce.position.y = (o.hop||0)*w + bound.lift;

  holdW = damp(holdW, ITEM[heldOf(outfit)]?.build ? 1 : 0, 4, dt);
  bound.bookW = damp(bound.bookW||0, heldOf(outfit)==='book' ? 1 : 0, 4, dt); const bw = bound.bookW*(1-w);   // reading pose

  // --- apply (parents first). Reactions take over the head from cursor-watching while they play.
  const lookK = 1 - Math.min(1, w*1.4);

    if (o.lElb || bw > 0.001) premulChar(B.Left_Elbow,  new THREE.Quaternion().setFromEuler(new THREE.Euler(-(g('lElb',0) + 0.8*bw), 0, 0)));

  }
  if (B.Left_Knee){
    if (o.lKnee || mp.lKnee) premulChar(B.Left_Knee,  new THREE.Quaternion().setFromEuler(new THREE.Euler(g('lKnee',0), 0, 0)));
    if (o.rKnee || mp.rKnee) premulChar(B.Right_Knee, new THREE.Quaternion().setFromEuler(new THREE.Euler(g('rKnee',0), 0, 0)));
  }
  groundFeet();
  const held = mainRig.attached.held;
  if (held) held.userData.pxGroup.position.set(g('item',0), g('item',1), g('item',2));

  // glow pulse when clothes change
  glow = Math.max(0, glow - dt*2.2);
  mainRig.mat.emissive.setRGB(glow*0.42, glow*0.42, glow*0.48);   // masked by glowTex: only the changed pixels light up

  // blink by closing the eye row for a moment
  if (!blink.on && now>blink.next){ blink.on=true; blink.until=now+0.11; drawEyes(true); }
  if (blink.on && now>blink.until){ blink.on=false; blink.next=now+rand(2.2,6); if (Math.random()<0.2) blink.next=now+0.25; drawEyes(false); }
}

  if (!curImage) return;
  if (!closed){ mainRig.ctx.putImageData(curImage,0,0); mainRig.tex.needsUpdate=true; return; }
  const row = mainRig.ctx.getImageData(8,11,8,1);
  mainRig.ctx.putImageData(row,8,12); mainRig.tex.needsUpdate=true;

    const e = new DataView(new ArrayBuffer(46)); e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint32(16, c, true); e.setUint32(20, data.length, true); e.setUint32(24, data.length, true); e.setUint16(28, nb.length, true); e.setUint32(42, off, true);
    cd.push(e.buffer, nb); off += 30 + nb.length + data.length;
  }
  const cdSize = cd.reduce((a, b) => a + b.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cd, end.buffer], { type: 'application/zip' });
}
$('#takeBtn').onclick = () => TAKE.on ? takeStop() : takeStart();
$('#recStop').onclick = () => takeStop();

/* ============================================================
   LAYOUT + LOOP
   ============================================================ */
let baseFov = 45, baseYaw = 0, parallaxK = 1, layoutZ = 1;
const camBase = new THREE.Vector3(0, ROOM.camH, 0), camAhead = new THREE.Vector3(0, ROOM.camH, -ROOM.D);
let LR = { w:1, h:1 };   // the scene rect from layout(), reused by the skill-screen camera offset
function layout(){
  const W=innerWidth, H=innerHeight, wide = W>=820; renderer.setSize(W,H,false);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  // UI scale: designed at 1600×900, kept a touch smaller so the character stays the focus
  const z = wide ? clamp(Math.min(W/1600, H/900)*0.9, 0.58, 1) : clamp(W/560, 0.6, 0.82);
  document.documentElement.style.setProperty('--z', z.toFixed(3));
  if (wide) document.documentElement.style.setProperty('--gridMax', Math.max(170, H/z - 104 - 90 - 175 - 60)+'px');
  else document.documentElement.style.setProperty('--gridMax', Math.max(120, H*0.36/z - 120)+'px');
  const pr = $('#panel').getBoundingClientRect();
  // the room image "covers" the scene rect: whole screen on desktop, the area above the sheet on phones
  const rect = wide ? {w:W, h:H} : {w:W, h:Math.round(pr.top + 30)};
  const asp = rect.w/rect.h;
  const vt = (asp <= ROOM.ASPECT ? ROOM.VTAN : ROOM.VTAN*ROOM.ASPECT/asp) * 0.94;   // 6% margin for parallax
  baseFov = THREE.MathUtils.radToDeg(2*Math.atan(vt));
  camera.fov = baseFov; camera.aspect = asp; camera.zoom = 1;
  camera.setViewOffset(rect.w, rect.h, 0, 0, W, H); LR = rect; SKT.offA = -1;
  camera.updateProjectionMatrix();
  camera.position.copy(camBase); camera.lookAt(camAhead); camera.updateMatrixWorld(true);
  renderer.getDrawingBufferSize(wipeRes);
  parallaxK = wide ? 1 : 0.6;
  layoutZ = z;
  if (camS.to){ camS.to = shotState(camS.shot); }
}
addEventListener('resize', layout);

const clock = new THREE.Clock();
const _dir = new THREE.Vector3(), _dir2 = new THREE.Vector3(), _chest = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 1/20), now = nowS();
  useChar(active);

  // camera: eased blend between shots + slow handheld drift + mouse parallax + scroll zoom
  camS.t = Math.min(1, camS.t + dt/camS.dur); const ck = easeIO(camS.t);
  camS.cur.pos.lerpVectors(camS.from.pos, camS.to.pos, ck);
  camS.cur.look.lerpVectors(camS.from.look, camS.to.look, ck);
  camS.cur.fovK = camS.from.fovK + (camS.to.fovK-camS.from.fovK)*ck;
  camS.cur.drift = camS.from.drift + (camS.to.drift-camS.from.drift)*ck;
  // scroll: zoom in up to 3x on what this view frames, or out toward the whole room (stays inside the picture)
  zoom = damp(zoom, zoomT, 6, dt);
  const zIn = Math.max(0, zoom), zOut = smooth(0, 1, Math.max(0, -zoom));
  const pk = (SET.parallax ? parallaxK : 0)*(1-zOut*0.85)/(1+zIn*1.5), dr = camS.cur.drift*pk;
  par.x = damp(par.x, mouse.inside ? mouse.ndc.x : 0, 2.5, dt); par.y = damp(par.y, mouse.inside ? mouse.ndc.y : 0, 2.5, dt);
  camera.position.copy(camS.cur.pos).lerp(camBase, smooth(0,0.75,zOut)).add(_dir.set(
    par.x*0.2*pk + Math.sin(now*0.23)*0.05*dr + Math.sin(now*0.11+1.3)*0.03*dr,
    par.y*0.09*pk + Math.sin(now*0.31+0.7)*0.025*dr,
    Math.sin(now*0.17+2.1)*0.04*dr));
  _chest.copy(CHAR_POS).setY(1.15*CHAR_SCALE);
  const zk = smooth(0,1,zIn)*(camS.shot==='totaal' ? 0.85 : 0.3);
  camera.lookAt(_dir2.copy(camS.cur.look).lerp(camAhead, zOut).lerp(_chest, zk));
  const f = baseFov*(camS.cur.fovK + (1.05-camS.cur.fovK)*zOut)/(1+zIn*(ZOOM_IN[camS.shot] ?? 1)); if (Math.abs(camera.fov-f)>1e-3){ camera.fov = f; camera.updateProjectionMatrix(); }
  SKT.off = damp(SKT.off, SKT.open && innerWidth>=820 ? 0.19 : 0, 5, dt); if (SKT.off < 1e-4) SKT.off = 0;
  if (Math.abs(SKT.off-SKT.offA) > 1e-5){ SKT.offA = SKT.off; camera.setViewOffset(LR.w, LR.h, SKT.off*innerWidth, 0, innerWidth, innerHeight); camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld(true);
  placeArrows(innerWidth, innerHeight, layoutZ);
  updateWipe(dt);

  scene.updateMatrixWorld(true);
  for (const c of chars){ useChar(c); updateChar(dt, now); }
  updateFloorProps(dt);
  // skill screen: the room fades to white and everyone but the active character pops away
  SKT.white = damp(SKT.white||0, SKT.open ? 1 : 0, 3.2, dt); if (SKT.white < 1e-3) SKT.white = 0;
  ROOM_WHITE.value = smooth(0, 1, SKT.white);
  for (const c of chars){ if (c.appear < 1) continue;
    const hide = c!==active && SKT.white > 0.35;
    if (hide === !!c.isoHidden) continue;
    c.isoHidden = hide; c.turntable.visible = c.blob.visible = !hide;
    spawnAt(c.turntable.position.clone().setY(1.0), [0xffffff,0xe9eef5,0xd5dae4], 18, 1.1);
  }
  useChar(active);

  // item pop-out
  for (let i=dying.length-1;i>=0;i--){ const h=dying[i]; h.userData.rt+=dt; const k=1-h.userData.rt/0.18;
    if (k<=0){ h.parent?.remove(h); disposeTree(h); dying.splice(i,1); } else h.userData.pxGroup.scale.setScalar(k*PX); }

  // particles
  for (let i=parts.length-1;i>=0;i--){ const p=parts[i], u=p.userData; u.t+=dt;
    if (u.t>u.life){ scene.remove(p); p.material.dispose(); parts.splice(i,1); continue; }
    if (u.dust){ u.v.multiplyScalar(Math.exp(-4*dt)); u.v.y += 0.25*dt; } else u.v.y -= 3.2*dt;
    p.position.addScaledVector(u.v, dt);
    p.rotation.x += u.spin.x*dt; p.rotation.y += u.spin.y*dt;
    const k = 1-u.t/u.life;
    if (u.dust){ p.scale.setScalar(u.s0*(1+1.8*(1-k))); p.material.opacity = 0.7*k*Math.min(1,u.t*12); }
    else { p.scale.setScalar(Math.max(0.01,k)); p.material.opacity = Math.min(1,k*1.5); } }

  renderer.render(scene, camera);
  updateBubbles();
  if (TAKE.on) takeSample();
  if (HAND) HAND(dt);
}
const elastic = x => x===1?1 : Math.pow(2,-9*x)*Math.sin((x*9-0.75)*(2*Math.PI)/3)+1;

init().catch(err=>{ console.error(err); $('#lerr').textContent = 'Could not load the character: '+err.message+' (serve this folder over http, e.g. node serve.js)'; });
</script>
